[package]
name = "ene-tool-fs"
version = "0.1.0"
edition = "2024"
description = "Filesystem tools: read, write, edit, glob, grep, patch, shell execution, and undo with sandbox security"

[[bin]]
name = "ene-tool-fs"
path = "src/main.rs"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tool-common = { workspace = true }
ene-tool-derive = { workspace = true }
ene-tool-db = { workspace = true }
tokio = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
strsim = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true, features = ["rust_backend"] }

[lints]
workspace = true
