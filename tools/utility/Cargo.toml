[package]
name = "ene-tool-utility"
version = "0.1.0"
edition = "2024"
description = "Built-in utility tools: user questioning, todo list management, system time/info"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tool-common = { workspace = true }
ene-tool-derive = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
diesel = { version = "2.3", features = ["sqlite", "chrono"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

[[bin]]
name = "ene-tool-utility"
path = "src/main.rs"
