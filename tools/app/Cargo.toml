[package]
name = "ene-tool-app"
version.workspace = true
edition.workspace = true
description = "OS-level GUI automation: window management, keyboard/mouse control, screenshots, clipboard"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tool-common = { workspace = true }
ene-tool-derive = { workspace = true }
enigo = { workspace = true }
xcap = { workspace = true }
active-win-pos-rs = { workspace = true }
base64 = { workspace = true, features = ["std"] }
image = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
arboard = { workspace = true }

[[bin]]
name = "ene-tool-app"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["tokio", "screenshot", "screencast", "pipewire"] }
pipewire = { workspace = true }

[lints]
workspace = true
