[package]
name = "ene-tool-app"
version.workspace = true
edition.workspace = true
description = "OS-level GUI automation: window management, keyboard/mouse control, screenshots, clipboard"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tool-common = { workspace = true }
ene-tool-derive = { workspace = true }
enigo = "0.6"
xcap = "0.9.6"
active-win-pos-rs = "0.11.0"
base64 = { workspace = true, features = ["std"] }
image = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[[bin]]
name = "ene-tool-app"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "screencast", "pipewire"] }
pipewire = "0.9"

[lints]
workspace = true
