[package]
name = "ene-tool-web"
version = "0.1.0"
edition = "2024"
description = "Web tools: URL fetching with HTML-to-Markdown conversion and multi-backend web search"

[dependencies]
ene-tool-proto = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
ene-tool-common = { workspace = true }
ene-tool-derive = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
websearch = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["rustls", "json", "query"] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { workspace = true, features = ["native-tls", "json", "query"] }

[[bin]]
name = "ene-tool-web"
path = "src/main.rs"

[lints]
workspace = true
