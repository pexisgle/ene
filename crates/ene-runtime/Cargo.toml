[package]
name = "ene-runtime"
version.workspace = true
edition.workspace = true
description = "Unified runtime facade integrating LLM streaming, tool orchestration, long-term memory, and session management"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
ene-mind = { workspace = true }
ene-ai = { workspace = true }
ene-ai-local = { workspace = true }
ene-voice = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-core = { workspace = true }
ene-store = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["jpeg"] }

once_cell = { workspace = true }
ene-rag = { workspace = true, features = ["tool"] }
ene-plugin-proto = { workspace = true }
ene-plugin-host = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
cargo-husky = { workspace = true }
sea-orm = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tracing-subscriber = { workspace = true }
# `test-util` gates `tokio::time::pause`/`advance` and the
# `#[tokio::test(start_paused = ...)]` attribute used by the #401 prompt-wait
# branch-ordering regression tests. Dev-only: unified in, and only compiled
# for, test builds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
