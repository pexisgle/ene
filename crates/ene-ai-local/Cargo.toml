[package]
name = "ene-ai-local"
version.workspace = true
edition.workspace = true
description = "Local GGUF model providers (llama.cpp) for the ene AI character platform"
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["local"]
local = ["dep:llama-cpp-4", "llama-cpp-4/mtmd", "llama-cpp-4/openmp"]
vulkan = ["dep:llama-cpp-4", "llama-cpp-4/vulkan"]
cuda = ["dep:llama-cpp-4", "llama-cpp-4/cuda"]

[dependencies]
ene-ai = { workspace = true }
ene-config = { workspace = true }
ene-plugin-proto = { workspace = true }
llama-cpp-4 = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
base64 = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
