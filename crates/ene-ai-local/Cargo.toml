[package]
name = "ene-ai-local"
version.workspace = true
edition.workspace = true
description = "Local GGUF model providers (llama.cpp) for the ene AI character platform"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["local"]
local = ["dep:llama-cpp-4", "llama-cpp-4/mtmd", "llama-cpp-4/openmp"]
vulkan = ["dep:llama-cpp-4", "llama-cpp-4/vulkan"]
cuda = ["dep:llama-cpp-4", "llama-cpp-4/cuda"]

[dependencies]
ene-ai = { workspace = true }
ene-config = { workspace = true }
ene-infer = { workspace = true }
ene-plugin-proto = { workspace = true }
llama-cpp-4 = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ene-infer = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
