[package]
name = "ene-memory"
version = "0.1.0"
edition = "2024"
description = "SQLite-vec powered episodic memory store with vector similarity search, key facts, and LLM-driven summarization"

[lib]
crate-type = ["lib"]

[dependencies]
ene-provider = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
diesel = { version = "2.3", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
sqlite-vec = "0.1"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

ene-common = { workspace = true }
ene-config = { workspace = true }
ctor = { workspace = true }
