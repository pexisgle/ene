[package]
name = "ene-memory"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { version = "0.38.2", features = ["chat-completion", "embedding"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.2", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlite-vec = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = { workspace = true }
tracing = "0.1"
ene-config = { path = "../ene-config" }
ene-embedding = { path = "../ene-embedding" }
