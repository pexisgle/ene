[package]
name = "ene-tools-browser"
version = "0.1.0"
edition = "2024"
description = "Chromium browser automation via Chrome DevTools Protocol: navigation, interaction, content extraction"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tools-common = { workspace = true }
chromiumoxide = "0.9"
base64 = "0.22"
dashmap = "6"
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
uuid = { version = "1", features = ["v4"] }
regex = { workspace = true }

[[bin]]
name = "ene-tools-browser"
path = "src/main.rs"
