[package]
name = "ene-tools-web"
version = "0.1.0"
edition = "2024"
description = "Web tools: URL fetching with HTML-to-Markdown conversion and multi-backend web search"

[dependencies]
ene-tool-proto = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { workspace = true }
schemars = { workspace = true }
ene-tools-common = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
websearch = "0.1.1"

[[bin]]
name = "ene-tools-web"
path = "src/main.rs"
