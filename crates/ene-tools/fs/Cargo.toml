[package]
name = "ene-tools-fs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ene-tools-fs"
path = "src/main.rs"

[dependencies]
ene-tool-proto = { workspace = true }
ene-tools-utility = { workspace = true }
ene-tools-common = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "process", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
walkdir = "2"
glob = "0.3"
strsim = "0.11"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
rusqlite = { version = "0.39", features = ["bundled"] }
flate2 = "1"
