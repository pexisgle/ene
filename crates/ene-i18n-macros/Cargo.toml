[package]
name = "ene-i18n-macros"
version.workspace = true
edition.workspace = true
description = "Proc-macro that generates type-safe i18n accessor functions from Fluent .ftl files"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
fluent-syntax = { workspace = true }

[dev-dependencies]
trybuild = "1"
i18n-embed = { version = "0.16", features = ["fluent-system", "fluent"] }
i18n-embed-fl = "0.10"
fluent-bundle = { workspace = true }
rust-embed = "8.11"

[lints]
workspace = true
