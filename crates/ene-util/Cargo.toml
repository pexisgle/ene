[package]
name = "ene-util"
version.workspace = true
edition.workspace = true
description = "Pure utility functions with feature-gated heavy dependencies — truncation helpers and HTML-to-Markdown conversion"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["truncate"]
truncate = []
html = ["dep:htmd", "dep:scraper", "dep:ego-tree", "dep:regex"]

[dependencies]
htmd = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
ego-tree = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tracing = { workspace = true }

[dev-dependencies]
ene-util = { path = ".", features = ["html"] }

[lints]
workspace = true
