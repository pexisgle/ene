[package]
name = "ene-tool-host"
version = "0.1.0"
edition = "2024"
description = "Tool process lifecycle manager — spawns, supervises, and auto-restarts tool binaries with exponential backoff"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = "6"
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
ene-config = { workspace = true }
ene-provider = { workspace = true }
ene-memory = { workspace = true }
ene-tool-proto = { workspace = true }
