[package]
name = "ene-core"
version = "0.1.0"
edition = "2024"
description = "Unified runtime facade integrating LLM streaming, tool orchestration, long-term memory, and session management"

[lib]
crate-type = ["lib"]

[dependencies]
ene-common = { workspace = true }
ene-provider = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-embedding = { workspace = true }
ene-memory = { workspace = true }
ene-tool-db = { workspace = true }
diesel = { workspace = true }
libsqlite3-sys = { workspace = true }
blake3 = { workspace = true }

ene-session = { workspace = true }
ene-tool-host = { workspace = true }
ene-tool-proto = { workspace = true }

# Git hooks installer. Listed as a regular dep so its `prepare.rs` runs
# on every `cargo build` (dev-deps are not compiled for plain `cargo build`
# on a lib crate). cargo-husky is build-time-only: it does not expose any
# symbols to ene-core, and its hook side-effects only fire inside a git
# working tree. The `user-hooks` feature copies the executable scripts
# under `.cargo-husky/hooks/` into `.git/hooks/`.
cargo-husky = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
