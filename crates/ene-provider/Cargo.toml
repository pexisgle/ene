[package]
name = "ene-provider"
version = "0.1.0"
edition = "2024"
description = "Pluggable LLM Provider trait and built-in implementations for the ene platform"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { workspace = true, default-features = false }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-tool-proto = { workspace = true }
ctor = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["native-tls"] }

[dev-dependencies]
reqwest = { workspace = true }


[lints]
workspace = true
