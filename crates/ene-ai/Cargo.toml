[package]
name = "ene-ai"
version.workspace = true
edition.workspace = true
description = "LLM and embedding providers for the ene platform"

[lib]
crate-type = ["lib"]

[features]
default = []
# GPU backends for llama-cpp-2 (decision + local embedding).
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]

[dependencies]
async-openai = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["io-util", "sync", "time", "macros", "rt"] }
parking_lot = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-tool-proto = { workspace = true }
ctor = { workspace = true }
thiserror = { workspace = true }
llama-cpp-2 = { workspace = true, default-features = false, features = ["common"] }
encoding_rs = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["rustls", "byot"] }
reqwest = { workspace = true, features = ["rustls", "json"] }
hf-hub = { workspace = true, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["native-tls", "byot"] }
reqwest = { workspace = true, features = ["native-tls", "json"] }
hf-hub = { workspace = true }

[lints]
workspace = true
