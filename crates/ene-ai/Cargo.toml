[package]
name = "ene-ai"
version.workspace = true
edition.workspace = true
description = "LLM and embedding providers for the ene platform"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["io-util", "sync", "time", "macros", "rt", "fs"] }
parking_lot = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
serde = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-plugin-proto = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
ctor = { workspace = true }
base64 = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["rustls", "byot"] }
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["native-tls", "byot"] }
reqwest = { workspace = true, features = ["native-tls", "json", "stream"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs"] }

[lints]
workspace = true
