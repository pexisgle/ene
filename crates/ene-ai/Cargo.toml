[package]
name = "ene-ai"
version.workspace = true
edition.workspace = true
description = "LLM and embedding providers for the ene platform"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []
# GPU backends for llama-cpp-2 (decision + local embedding).
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
# Local voice pipeline providers (pull in heavy native dependencies).
local-stt = ["dep:whisper-rs"]
local-tts = ["dep:ort"]
silero-vad = ["dep:ort"]
# Enable all local voice providers.
voice = ["local-stt", "local-tts", "silero-vad"]

[dependencies]
async-openai = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["io-util", "sync", "time", "macros", "rt", "fs"] }
parking_lot = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }
ene-tool-proto = { workspace = true }
ctor = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
llama-cpp-2 = { workspace = true, default-features = false, features = ["common", "mtmd"] }
encoding_rs = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["png", "jpeg"] }
# Local voice pipeline (optional; enabled by feature flags above).
whisper-rs = { workspace = true, optional = true }
# `load-dynamic` defers ONNX Runtime loading to runtime (dlopen) so the crate
# compiles without a build-time binary download; the desktop app provides the
# `libonnxruntime` shared library (Phase 5). `api-24` matches the ONNX Runtime
# ABI the crate is compiled against.
ort = { workspace = true, optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["rustls", "byot"] }
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
async-openai = { workspace = true, default-features = false, features = ["native-tls", "byot"] }
reqwest = { workspace = true, features = ["native-tls", "json", "stream"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs"] }

[lints]
workspace = true
