[package]
name = "ene-artifact"
version.workspace = true
edition.workspace = true
description = "Signed artifact catalog, content-addressable storage, resumable downloads, and one-generation rollback installer"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
ed25519-dalek = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "time", "sync", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }

[lints]
workspace = true
