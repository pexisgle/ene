[package]
name = "ene-vrm"
version = "0.1.0"
edition = "2024"
description = "VRM 1.0 character renderer for the ene desktop app, built on wgpu 29 and the gltf crate."

[dependencies]
# glTF 2.0 parser. `default-features = false` to keep the dependency
# graph small. We need `KHR_materials_unlit` (MToon flag), the
# `extensions` meta-feature (VRMC_vrm 1.0 helpers, plus KHR_*), and
# `utils` for the `Primitive::reader` / `Skin::reader` API that
# pulls positions / normals / tex coords / inverse-bind matrices
# out of the BIN chunk.
gltf = { version = "1.4", default-features = false, features = ["KHR_materials_unlit", "extensions", "utils", "names"] }

# PNG decode for embedded base-color textures.
image = { version = "0.25", default-features = false, features = ["png"] }

base64 = { version = "0.22", default-features = false, features = ["alloc"] }

wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# PR4.8: hand-rolled JSON parse of the
# `VRMC_vrm.lookAt` block. The runtime walks the
# `serde_json::Value` tree produced by the `gltf`
# crate's `Document::extensions()` accessor; pulling in
# `serde_json` directly is the path of least resistance
# (the alternative — write our own JSON walker — would
# be hundreds of lines for negligible benefit). The
# `gltf` crate already pulls in `serde_json` transitively
# so this is a one-line Cargo.toml change with no
# additional binary weight.
serde_json = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
# PR4.8: tests for `load_look_at` build a minimal glTF
# document with a `VRMC_vrm.lookAt` block. The runtime
# parser is hand-rolled, but the test fixture needs a
# JSON serializer to round-trip the block through the
# `gltf::Gltf::from_slice` path. `serde_json` is also a
# regular dep (the lib consumes the parsed JSON values
# via `serde_json::Value`); listed under dev-dependencies
# so the test-only `json!` macro usage is documented.
serde_json = { workspace = true }
# `inspect_aabb` example extracts a `.glb` payload from a
# VRM 1.0 zip archive. Pulled in as a dev-dep so the lib
# itself stays slim.
zip = { version = "2", default-features = false, features = ["deflate"] }
