[package]
name = "ene-session"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { version = "0.38.2", features = ["chat-completion", "embedding"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = { workspace = true }
tracing = "0.1"
ene-config = { path = "../ene-config" }
ene-embedding = { path = "../ene-embedding" }
ene-memory = { path = "../ene-memory" }
