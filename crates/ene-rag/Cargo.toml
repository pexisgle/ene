[package]
name = "ene-rag"
version.workspace = true
edition.workspace = true
description = "RAG policy layer — scoring, decay, embedding management, and tool selection for the ene AI companion"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = []
# Tool-selection RAG pipeline (multi-vector embedding, weighted field
# similarity, rerank). Pulls in `ene-ai` / `ene-plugin-proto` / `ene-config`.
# Persistence crates that only need the pure scoring/decay core (`ene-store`)
# and cognitive callers (`ene-mind`) leave this off, so they never drag the
# embedding/LLM machinery into the persistence layer (AGENTS.md: `ene-store` ↛
# `ene-ai`). `ene-runtime` enables it to build the tool-selection pipeline.
tool = [
    "dep:ene-ai",
    "dep:ene-plugin-proto",
    "dep:async-trait",
    "dep:blake3",
    "dep:parking_lot",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
ene-core = { workspace = true }
ene-config = { workspace = true }
chrono = { workspace = true }
ctor = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
unicode-normalization = { workspace = true }

# tool-selection pipeline (feature = "tool")
ene-ai = { workspace = true, optional = true }
ene-plugin-proto = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[lints]
workspace = true
