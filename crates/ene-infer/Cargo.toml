[package]
name = "ene-infer"
version.workspace = true
edition.workspace = true
description = "Synchronous, single-threaded model trait plus an async worker-thread framework for local inference engines (LLM, embedding, STT, TTS)"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Exposes `conformance::run_all`, a generic regression battery that downstream
# engine crates (ene-ai-local, ene-voice, ...) run against their own
# `LocalModel` implementations. Kept behind a feature so the assertions/panics
# it relies on to report failures never ship in the default build.
test-util = []

[dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
