[package]
name = "ene-ai-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { version = "0.38.2", features = ["chat-completion", "embedding"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.10.1"
indexmap = "2"
async-stream = "0.3.5"
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = "0.4"
regex = "1"
tracing = "0.1"
ene-config = { path = "../ene-config" }
ene-embedding = { path = "../ene-embedding" }
ene-memory = { path = "../ene-memory" }
ene-session = { path = "../ene-session" }
ene-tool-host = { path = "../ene-tool-host" }