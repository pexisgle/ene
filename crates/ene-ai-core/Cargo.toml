[package]
name = "ene-ai-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-openai = { version = "0.38.2", features = ["chat-completion", "embedding"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.10.1"
indexmap = "2"
async-stream = "0.3.5"
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlite-vec = "0.1"
rmcp = { version = "1.5", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
xcap = "0.9.4"
active-win-pos-rs = "0.10.1"
base64 = "0.22"
image = "0.25"
regex = "1"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
diff = "0.1"
walkdir = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["rustls-tls", "tokio"] }
candle-core = "0.10"
candle-nn = "0.10"
tokenizers = "0.23"
dirs = "6"
tracing = "0.1"
strsim = "0.11"
enigo = "0.6"
urlencoding = "2.1"
chromiumoxide = "0.9"
scraper = "0.27"
html2md = "0.2"
