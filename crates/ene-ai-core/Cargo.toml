[package]
name = "ene-ai-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
async-openai = { version = "0.38.2", features = ["chat-completion", "embedding"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.10.1"
indexmap = "2"
async-stream = "0.3.5"
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = "0.4"
diesel = { version = "2.2", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlite-vec = "0.1"
rmcp = { version = "1.5", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["rustls-tls", "tokio"] }
candle-core = "0.10"
candle-nn = "0.10"
tokenizers = "0.23"
dirs = "6"
tracing = "0.1"
ene-tool-proto = { path = "../ene-tool-proto" }