[package]
name = "ene-connector"
version.workspace = true
edition.workspace = true
description = "Shared connector framework for external service integrations (Calendar, MCP, GitHub, etc.)"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib"]

# NOTE: `ene-config` and `ene-plugin-proto` are deliberately NOT dependencies.
# Per #308, exposing config/proto weight through this crate would propagate it
# to every plugin that sees these credential types. The dependency direction is
# `ene-plugin-host` knows both connector and proto, never the reverse (#412).
[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
