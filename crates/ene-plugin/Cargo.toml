[package]
name = "ene-plugin"
version.workspace = true
edition.workspace = true
description = "Plugin authoring facade: Plugin trait, run_plugin_server entry point, and dispatch loop"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin-proto = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "signal", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true, features = ["send_guard"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "signal", "time", "macros", "rt", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
