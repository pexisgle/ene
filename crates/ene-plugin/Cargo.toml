[package]
name = "ene-plugin"
version.workspace = true
edition.workspace = true
description = "Plugin authoring facade: Plugin trait, run_plugin_server entry point, and dispatch loop"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Pulls in `reqwest` + `http` for `CredentialClient::http_client` /
# `http_client_with`. Kept behind a feature so tool-only plugin binaries
# (which never make HTTP calls) do not link the TLS stack.
http = ["dep:reqwest", "dep:http"]

[dependencies]
ene-plugin-proto = { workspace = true }
ene-infer = { workspace = true }
ene-tool-macros = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
chrono = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true, features = ["send_guard"] }
reqwest = { workspace = true, features = ["rustls", "json"], optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }

[lints]
workspace = true
