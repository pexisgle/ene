[package]
name = "ene-voice"
version.workspace = true
edition.workspace = true
description = "Local voice pipeline providers (STT/TTS/VAD) for the ene AI character platform"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
local-stt = ["dep:whisper-rs"]
local-tts = ["dep:ort"]
silero-vad = ["dep:ort"]
voice = ["local-stt", "local-tts", "silero-vad"]

[dependencies]
ene-ai = { workspace = true }
ene-config = { workspace = true }
ene-infer = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ctor = { workspace = true }
whisper-rs = { workspace = true, optional = true }
ort = { workspace = true, optional = true, features = ["std", "ndarray", "load-dynamic", "api-24"] }

[dev-dependencies]
tempfile = { workspace = true }
ene-infer = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
