[package]
name = "ene-registry"
version.workspace = true
edition.workspace = true
description = "Unified tool registry: side_effects filter, deny-by-default pipeline, builtins"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
ene-plugin-ipc = { workspace = true, features = ["net"] }
ene-plane = { workspace = true }
parking_lot = { workspace = true }
arboard = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
htmd = { workspace = true }
scraper = { workspace = true }
uuid = { workspace = true }
process-wrap = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true }

[target.'cfg(windows)'.dependencies]
image = { workspace = true, features = ["png"] }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
