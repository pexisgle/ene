[package]
name = "ene-registry"
version.workspace = true
edition.workspace = true
description = "Unified tool registry: side_effects filter, deny-by-default pipeline, builtins"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Declared so path-included exec logic.rs cfg checks are known; leave disabled.
win32-job = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
ene-plugin-ipc = { workspace = true, features = ["net"] }
ene-plane = { workspace = true }
parking_lot = { workspace = true }
arboard = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true }

[target.'cfg(windows)'.dependencies]
image = { workspace = true, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
