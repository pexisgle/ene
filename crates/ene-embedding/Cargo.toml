[package]
name = "ene-embedding"
version = "0.1.0"
edition = "2024"
description = "Vector embedding providers — supports local Candle/GGUF inference"

[lib]
crate-type = ["lib"]

[dependencies]
ene-provider = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
ene-config = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }
accelerate-src = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
hf-hub = { workspace = true, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
hf-hub = { workspace = true }


[lints]
workspace = true
