[package]
name = "ene-embedding"
version = "0.1.0"
edition = "2024"
description = "Vector embedding providers — supports local Candle/GGUF inference"

[lib]
crate-type = ["lib"]

[dependencies]
ene-provider = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
candle-core = "0.10"
candle-nn = "0.10"
tokenizers = "0.23"
tracing = { workspace = true }
ene-config = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
hf-hub = { version = "0.5.0", default-features = false, features = [
    "rustls-tls",
    "tokio",
] }

[target.'cfg(target_os = "windows")'.dependencies]
hf-hub = { version = "0.5.0", default-features = false, features = [
    "default-tls",
    "tokio",
] }

