[package]
name = "ene-plugin-broker"
version.workspace = true
edition.workspace = true
description = "Plugin-side broker client: typed access to host-mediated file, network, process, credential, artifact, and platform services"
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
ene-plugin-proto = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
