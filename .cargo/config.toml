[future-incompat-report]
frequency = "never"

[env]
# Bundled rusqlite compiles SQLite without the math extension by default.
# Companion forgetting uses `exp()`; keep the flag so plain `cargo test`
# matches the Nix shell.
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_MATH_FUNCTIONS"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
]
