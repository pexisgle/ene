[future-incompat-report]
frequency = "never"

[env]
# Bundled rusqlite compiles SQLite without the math extension by default.
# Keep the flag so SQL that uses `exp()` (and similar) works in plain
# `cargo test` the same way it does inside the Nix shell.
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_MATH_FUNCTIONS"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
]
