[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-Zshare-generics=y",
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=all",
]

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"
