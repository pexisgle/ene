[book]
authors = ["Ene Team"]
language = "ja"
src = "."
title = "Ene ドキュメント"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/pexisgle/Ene"
additional-js = ["mermaid.js", "katex.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
