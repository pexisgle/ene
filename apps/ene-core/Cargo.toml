[package]
name = "ene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["ene-store/test-support"]

[dependencies]
clap.workspace = true
ene-action = { path = "../../crates/ene-action" }
ene-config = { path = "../../crates/ene-config" }
ene-api = { path = "../../crates/ene-api" }
ene-companion = { path = "../../crates/ene-companion" }
ene-credential = { path = "../../crates/ene-credential" }
ene-inference = { path = "../../crates/ene-inference" }
ene-learning = { path = "../../crates/ene-learning" }
