ene-plugin-ipc = { path = "../../crates/ene-plugin-ipc" }
ene-presence = { path = "../../crates/ene-presence" }
ene-presentation = { path = "../../crates/ene-presentation" }
ene-preservation = { path = "../../crates/ene-preservation" }
ene-primitive = { path = "../../crates/ene-primitive" }
ene-store = { path = "../../crates/ene-store" }
ene-task = { path = "../../crates/ene-task" }
ene-local-control = { path = "../../crates/ene-local-control" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true
