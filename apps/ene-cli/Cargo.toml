[package]
name = "ene-cli"
version = "0.1.0"
edition = "2024"
description = "Interactive CLI REPL for chatting with AI characters, testing tools, and managing memory/sessions"

[dependencies]
ene-runtime = { workspace = true }
ene-mind = { workspace = true }
ene-config = { workspace = true }
ene-store = { workspace = true }
ene-tool-host = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-stream = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
dialoguer = "0.12"
console = "0.16.3"
futures-core = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rust-embed = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }

[lints]
workspace = true
