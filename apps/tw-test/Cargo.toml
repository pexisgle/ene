[package]
name = "tw-test"
version = "0.1.0"
edition = "2024"
description = "Bevy-based desktop GUI application with VRM character rendering, always-on-top overlay, and system tray"

[dependencies]
bevy = "0.18.1"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
raw-window-handle = "0.6"
