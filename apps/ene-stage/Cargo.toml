[package]
name = "ene-stage"
version.workspace = true
edition.workspace = true
description = "Product stage client: companion overlay, chat, detail, tray; talks to ene-core via ene-api"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-stage"
path = "src/main.rs"

[lib]
name = "ene_stage"
path = "src/lib.rs"

[features]
default = ["voice"]
voice = ["dep:cpal", "dep:rodio", "dep:rustfft"]

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
winit = { workspace = true }
ene-api = { workspace = true }
ene-config = { workspace = true }
directories = { workspace = true }
ene-ctl = { path = "../ene-ctl" }
ene-vrm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
parking_lot = { workspace = true }
pollster = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
rfd = { workspace = true }
global-hotkey = { workspace = true }
crossbeam-channel = { workspace = true }
indexmap = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
tray-icon = { workspace = true }
rust-embed = { workspace = true }
fluent-bundle = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
unic-langid = "0.9"
cpal = { workspace = true, optional = true }
rodio = { workspace = true, optional = true, features = ["playback"] }
rustfft = { workspace = true, optional = true }
notify-rust = "4"
zip = { workspace = true, features = ["deflate"] }
base64 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true }
tray-icon = { workspace = true, features = ["gtk"] }
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
fluent-syntax = { workspace = true }
