[package]
name = "ene-stage"
version.workspace = true
edition.workspace = true
description = "Native stage client (egui+wgpu): surface window plus a separate detail window"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-stage"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
egui = "0.35"
egui-wgpu = "0.35"
ene-api = { workspace = true }
ene-vrm = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }
wgpu = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
