[package]
name = "ene-desktop-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated Slint bindings for ene-desktop (compile isolation; no domain or secrets)"

[lib]
path = "src/lib.rs"

[dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

# Generated bindings trip workspace clippy (-D warnings). Domain logic,
# IPC, and secrets stay in `ene-desktop`. Do not name this crate ene-stage-ui.
[lints.rust]
dead_code = "allow"
unused = "allow"
unused_qualifications = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
let_underscore_must_use = "allow"
