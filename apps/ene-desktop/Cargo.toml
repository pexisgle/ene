[package]
name = "ene-desktop"
version.workspace = true
edition.workspace = true
description = "Frozen pre-redesign desktop client; no new features; talks to ene-core via ene-api"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["voice"]
voice = ["dep:cpal", "dep:rodio", "dep:rustfft"]

[dependencies]
winit = { workspace = true }
global-hotkey = { workspace = true }
wgpu = { workspace = true }
pollster = "1.0"
bytemuck = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rfd = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
ene-api = { workspace = true }
ene-config = { workspace = true }
ene-card = { workspace = true }
ene-vrm = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { workspace = true, features = ["rustls"] }
parking_lot = { workspace = true }
png = "0.18"
image = { workspace = true, features = ["png"] }
xcap = "0.9.6"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rapier3d = { version = "0.34", features = ["simd-stable"] }
bevy_ecs = { version = "0.19", default-features = false }
bevy_app = { version = "0.19", default-features = false }
device_query = "4"
rust-embed = { workspace = true }
fluent-bundle = { workspace = true }
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
active-win-pos-rs = "0.11.0"
crossbeam-channel = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
cpal = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ene-tray-linux = { workspace = true }
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["staging", "client"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
x11rb = { version = "0.13", default-features = false }
bitflags = "2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "screencast", "settings"] }
pipewire = "0.9"
futures = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
fluent-syntax = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
