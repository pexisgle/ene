[package]
name = "ene-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party text GUI: Client channel plus seated Host-local control"

# `ene-measure` is an optional measurement bin in the same package; a bare
# `cargo run -p ene-desktop` must still start the GUI.
default-run = "ene-desktop"

[[bin]]
name = "ene-desktop"
path = "src/main.rs"

[lib]
name = "ene_desktop"
path = "src/lib.rs"

[dependencies]
ene-api = { path = "../../crates/ene-api" }
ene-client = { path = "../../crates/ene-client" }
ene-config = { path = "../../crates/ene-config" }
ene-local-control = { path = "../../crates/ene-local-control" }
ene-plugin-ipc = { path = "../../crates/ene-plugin-ipc" }
ene-desktop-ui = { path = "../ene-desktop-ui" }
ene-body = { path = "../ene-body" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true
slint = { workspace = true }
csv.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[dev-dependencies]
ene-body = { path = "../ene-body", features = ["test-support"] }
ene-core = { path = "../ene-core", features = ["test-support"] }
ene-credential = { path = "../../crates/ene-credential" }
ene-inference = { path = "../../crates/ene-inference" }
ene-companion = { path = "../../crates/ene-companion" }
tempfile.workspace = true

[lints]
workspace = true
