[package]
name = "ene-desktop"
version.workspace = true
edition.workspace = true
description = "ene desktop: winit + wgpu + egui shell, AI bridge, and system tray"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["voice"]
# Local voice pipeline I/O: microphone capture (cpal) and TTS playback
# (rodio). Disable (`--no-default-features`) to build a text-only shell
# without the native audio toolchain (ALSA / PipeWire); the `audio` module
# compiles to inert stubs and the plugin-provided voice providers stay
# unreachable from the UI.
voice = ["dep:cpal", "dep:rodio", "dep:rustfft"]

[dependencies]
winit = "0.30"
global-hotkey = { workspace = true }
wgpu = { workspace = true }
pollster = "1.0"
bytemuck = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rfd = { workspace = true }
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
ene-runtime = { workspace = true }
ene-connector = { workspace = true }
ene-core = { workspace = true }
ene-mind = { workspace = true }
ene-ai = { workspace = true }
ene-store = { workspace = true }
ene-config = { workspace = true }
ene-card = { workspace = true }
ene-approval = { workspace = true }
ene-plugin-proto = { workspace = true }
ene-plugin-host = { workspace = true }
ene-util = { workspace = true }
ene-rag = { workspace = true, features = ["tool"] }
ene-vrm = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
png = "0.18"
image = { workspace = true, features = ["png"] }
xcap = "0.9.6"
tray-icon = { version = "0.24", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rapier3d = { version = "0.34", features = ["simd-stable"] }
bevy_ecs = { version = "0.19", default-features = false }
bevy_app = { version = "0.19", default-features = false }
device_query = "4"
rust-embed = "8.11"
fluent-bundle = { workspace = true }
i18n-embed = { version = "0.16", features = ["fluent-system", "fluent", "desktop-requester"] }
i18n-embed-fl = "0.10"
active-win-pos-rs = "0.11.0"
crossbeam-channel = { workspace = true }
regex = { workspace = true }
indexmap = { workspace = true }
# Local voice pipeline I/O (optional; enabled by the `voice` feature).
cpal = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["staging", "client"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
x11rb = { version = "0.13", default-features = false }
bitflags = "2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "screencast", "settings"] }
pipewire = "0.9"
futures = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
fluent-syntax = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
