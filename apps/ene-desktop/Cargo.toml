[package]
name = "ene-desktop"
version = "0.1.0"
edition = "2024"
description = "ene desktop: winit + wgpu + egui shell, AI bridge, and system tray"

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
ene-core = { workspace = true }
ene-config = { workspace = true }
ene-tool-proto = { workspace = true }
ene-vrm = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
tray-icon = { workspace = true }
ctor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rapier3d = { workspace = true }
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
device_query = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tray-icon = { workspace = true, default-features = false, features = ["gtk"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
x11rb = { workspace = true }
bitflags = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
