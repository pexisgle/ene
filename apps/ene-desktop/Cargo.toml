[package]
name = "ene-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "First-party text GUI: Client channel plus seated Host-local control"
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "ene-desktop"
path = "src/main.rs"

[lib]
name = "ene_desktop"
path = "src/lib.rs"

[dependencies]
ene-api = { path = "../../crates/ene-api" }
ene-client = { path = "../../crates/ene-client" }
ene-config = { path = "../../crates/ene-config" }
ene-local-control = { path = "../../crates/ene-local-control" }
ene-desktop-ui = { path = "../ene-desktop-ui" }
ene-body = { path = "../ene-body" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true
slint = { workspace = true }

[dev-dependencies]
ene-core = { path = "../ene-core", features = ["test-support"] }
ene-credential = { path = "../../crates/ene-credential" }
ene-inference = { path = "../../crates/ene-inference" }
ene-companion = { path = "../../crates/ene-companion" }
tempfile.workspace = true

[lints]
workspace = true
