name: CI runner experiment

# Temporary workflow for the Windows test-runner comparison PR. It runs the
# same suite several times under each candidate runner so timings and
# intermittent failures can be compared on identical hardware. The nextest
# commands append `cargo test --doc` because nextest does not run doctests.
# Removed before the PR leaves draft. Do not add concurrency cancellation: a
# push while a measurement is running would otherwise discard it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci-experiment.yml'
      - '.config/nextest.toml'
      - 'crates/ene-client/src/device.rs'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REPEATS: '5'

jobs:
  windows-runner:
    name: Windows ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cargo-parallel
            command: cargo test --locked --workspace --no-fail-fast
          - config: cargo-serial
            command: cargo test --locked --workspace --no-fail-fast -- --test-threads=1
          - config: nextest-parallel
            command: cargo nextest run --locked --workspace --no-fail-fast && cargo test --locked --workspace --doc
          - config: nextest-isolated
            command: cargo nextest run --locked --workspace --no-fail-fast --profile isolated && cargo test --locked --workspace --doc
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@nextest
      - name: Toolchain versions
        shell: bash
        run: |
          cargo --version
          cargo nextest --version
      - name: Warm build (excluded from measurements)
        run: cargo build --locked --workspace --all-targets
      - name: Run the suite repeatedly
        shell: bash
        run: |
          mkdir -p experiment
          : > experiment/summary.txt
          for run in $(seq 1 "$REPEATS"); do
            start=$(date +%s)
            set +e
            ${{ matrix.command }} > "experiment/${{ matrix.config }}-run-$run.log" 2>&1
            code=$?
            set -e
            end=$(date +%s)
            echo "EXPERIMENT config=${{ matrix.config }} run=$run exit=$code seconds=$((end - start))" | tee -a experiment/summary.txt
            if [ "$code" -ne 0 ]; then
              echo "---- ${{ matrix.config }} run $run failure excerpt ----"
              grep -E 'FAILED|panicked at|test result: FAILED|error\[|could not compile' "experiment/${{ matrix.config }}-run-$run.log" | head -40 || true
            fi
          done
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.config }}
          path: experiment
      - name: Report run failures
        if: always()
        shell: bash
        run: |
          if grep -qE 'exit=[^0]' experiment/summary.txt; then
            echo "At least one repeat failed; see the artifact and the excerpts above."
            exit 1
          fi
