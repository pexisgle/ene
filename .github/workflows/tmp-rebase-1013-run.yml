name: tmp-rebase-1013-run

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-rebase-1013-run.yml']

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/activate-session-transaction
          fetch-depth: 0
      - name: Merge current main preferring PR test hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -Xours origin/main
          rm -f .github/workflows/tmp-rebase-1013.yml .github/workflows/tmp-rebase-1013-run.yml tmp/rebase-1013-conflicts.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary rebase helpers'
          fi
          git push origin HEAD:codex/activate-session-transaction
