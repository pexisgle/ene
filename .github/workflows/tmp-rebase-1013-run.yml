name: tmp-rebase-1013-run

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-rebase-1013-run.yml']

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/activate-session-transaction
          fetch-depth: 0
      - name: Merge current main or publish conflict report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:codex/activate-session-transaction
            exit 0
          fi
          report=/tmp/rebase-1013-conflicts.txt
          {
            echo 'conflicted files:'
            git diff --name-only --diff-filter=U
            echo
            for f in $(git diff --name-only --diff-filter=U); do
              echo "===== $f ====="
              grep -n -B12 -A24 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
              echo
            done
          } > "$report"
          git merge --abort
          mkdir -p tmp
          cp "$report" tmp/rebase-1013-conflicts.txt
          git add tmp/rebase-1013-conflicts.txt
          git commit -m 'chore: report #1013 rebase conflicts'
          git push origin HEAD:codex/activate-session-transaction
          exit 0
