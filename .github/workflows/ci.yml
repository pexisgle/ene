name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build binaries
        # The binary-level E2E drives target/debug binaries as subprocesses;
        # `cargo test` alone does not link them.
        run: cargo build --locked --workspace
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps

  check-windows:
    name: Check Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --workspace
