name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'default' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  check:
    name: Check
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
      - uses: ./.github/actions/rust-build-env
      - name: Check asset provenance
        run: bash scripts/check-asset-provenance.sh
      - name: Test fetch character assets
        run: bash scripts/test-fetch-character-assets.sh
      - name: Check sidecar template
        run: bash scripts/check-sidecar-template.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  feature-matrix:
    name: Cargo feature matrix
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: ./.github/actions/rust-build-env
      - name: Check stage without voice
        run: cargo check --locked -p ene-stage --no-default-features
      - name: Check stage with voice
        run: cargo check --locked -p ene-stage --all-features
      - name: Check plugin IPC without network feature
        run: cargo check --locked -p ene-plugin-ipc
      - name: Check plugin IPC with network feature
        run: cargo check --locked -p ene-plugin-ipc --features net

  test:
    name: Tests
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/rust-build-env
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Run workspace tests
        run: cargo test --locked --workspace

  docs:
    name: Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/rust-build-env
      - name: Check documentation links
        run: bash scripts/check-docs-links.sh
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.4
      - name: Build English book
        run: mdbook build docs
      - name: Build Japanese book
        run: mdbook build docs/ja

  windows-native:
    name: Native Windows check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        ((github.event.action == 'labeled' && github.event.label.name == 'area:windows') ||
         (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'area:windows'))))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ripgrep
        shell: pwsh
        run: choco install ripgrep -y --no-progress
      - name: Lint native Windows applications
        run: >-
          cargo clippy --locked
          -p ene-daemon -p ene-stage
          -p ene-tool-app -p ene-tool-exec -p ene-tool-fs
          -p ene-sandbox -p ene-plugin-ipc -p ene-registry
          --all-targets -- -D warnings
      - name: Test Windows-compatible libraries
        run: cargo test --locked -p ene-config -p ene-plane -p ene-fiber
