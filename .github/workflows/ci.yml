name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: false
          # Source-only PR updates otherwise spend over a minute uploading a
          # fresh 600+ MB target cache after all required checks have passed.
          cache-save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@nextest
      - name: Install desktop GUI native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Integration tests spawn these from `target/debug`. Do not also link
      # the desktop product binary: its library is already covered below.
      - name: Build test fixture binaries
        run: cargo build --locked --bin ene-ctl --bin ene-core --bin ene-body
      - name: Run tests
        run: cargo nextest run --locked --workspace --no-fail-fast --test-threads 8
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps

  check-windows:
    name: Check Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@nextest
      # Integration tests spawn these from target/debug; nextest only links
      # test harnesses itself. The desktop product binary is not a fixture.
      - name: Build test fixture binaries
        run: cargo build --locked --bin ene-ctl --bin ene-core --bin ene-body
      - name: Run tests
        run: cargo nextest run --locked --workspace --no-fail-fast --test-threads 8
