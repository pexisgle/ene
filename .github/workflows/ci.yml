name: PR maintenance

on:
  pull_request:

jobs:
  diagnose-pr-828:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Diagnose PR 828 against current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin f20162b16dcb6aa13af6fcb2cf44d56b64a56ab9
          git fetch origin ce0090d077c655a642d12741e28bede1be8453fc
          git diff --binary f20162b16dcb6aa13af6fcb2cf44d56b64a56ab9 ce0090d077c655a642d12741e28bede1be8453fc > /tmp/pr-828.patch
          git reset --hard origin/main
          if git apply --3way --index /tmp/pr-828.patch; then
            echo 'PR828_APPLIES_CLEANLY'
          else
            echo '=== PR 828 CONFLICTS ==='
            git status --short
            git diff --cc || true
            exit 1
          fi
