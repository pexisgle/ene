name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-build-env
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group:
          # Every workspace package belongs to exactly one group; the union
          # is the full `cargo test --workspace` surface. Splitting the job
          # isolates a flaky/slow package so a rerun targets one group.
          - name: core
            packages: >-
              -p ene-card -p ene-config -p ene-session -p ene-kernel
              -p ene-plane -p ene-work -p ene-companion -p ene-body
              -p ene-fiber -p ene-registry -p ene-api -p ene-plugin-ipc
              -p ene-sandbox -p ene-vrm
          - name: apps
            packages: >-
              -p ene-daemon -p ene-ctl -p ene-desktop -p ene-stage
          - name: plugins
            packages: >-
              -p ene-harness-fs -p ene-harness-exec -p ene-harness-web
              -p ene-harness-utility
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-env
      - name: Run tests
        run: cargo test ${{ matrix.group.packages }}

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-env
      # Not run with RUSTDOCFLAGS=-D warnings: pre-existing broken
      # intra-doc links would fail unrelated work.
      - name: Build docs
        run: cargo doc --workspace --no-deps

  # Keep the two newest rust-cache generations per job, run after the
  # caching jobs save theirs.
  cache-prune:
    name: Prune rust caches
    if: github.ref == 'refs/heads/main'
    needs: [clippy, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Prune stale rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep_per_job=2
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | [.id, .key, .created_at] | @tsv' \
          | sort -k3,3r \
          | awk -v keep="$keep_per_job" '
              { job = $2; sub(/^v0-rust-/, "", job); sub(/-Linux-.*/, "", job) }
              count[job]++ < keep { next }
              { print $1 }' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null
              deleted=$((deleted + 1))
            done
          echo "Deleted ${deleted} stale rust-cache entries."
