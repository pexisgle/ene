name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rust-cache restores a completed target dir; incremental compilation on top
  # of that is wasted work and a common source of stale-artifact misses.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Keep a single rust-cache restore. The action caches by default
          # and would otherwise extract the same key twice.
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: true
      - uses: taiki-e/install-action@nextest
      - name: Install desktop GUI native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Integration tests spawn `ene-ctl` / `ene-core` from `target/debug`.
      # clippy and nextest do not link those product binaries.
      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins
      - name: Run tests
        run: cargo nextest run --locked --workspace --no-fail-fast
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps

  check-windows:
    name: Check Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: true
      # Linux and Windows cache keys are distinct. A failed Windows job does
      # not populate this restore. nextest is not used here: overlapping
      # binaries made Windows rename+read of the device file return
      # Unreadable (ene-client concurrent_stores). cargo test is the
      # proven-green runner on this OS.
      - name: Run tests
        run: cargo test --locked --workspace
