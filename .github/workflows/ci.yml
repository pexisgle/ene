name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@nextest
      - name: Install desktop GUI native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Integration tests spawn `ene-ctl` / `ene-core` from `target/debug`.
      # clippy and nextest do not link those product binaries.
      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins
      - name: Run tests
        run: cargo nextest run --locked --workspace --no-fail-fast
      # nextest does not run doctests; the compile_fail blocks that guard
      # secret-scrubbing APIs run here instead.
      - name: Run doctests
        run: cargo test --locked --workspace --doc
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps

  check-windows:
    name: Check Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Windows keeps `cargo test`: the two-round runner comparison found no
      # material nextest advantage once doctests were included, and cargo test
      # runs doctests and keeps the strict device-file assertion. Parallel test
      # threads are safe now that ene-body skips GPU init under test: 8 green
      # runs across both experiment rounds.
      - name: Run tests
        run: cargo test --locked --workspace --no-fail-fast
