name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: "nix develop .#ci --command {0}"
          # Failed runs must not persist partial caches.
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run clippy
        run: nix develop .#ci --command cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: "nix develop .#ci --command {0}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: nix develop .#ci --command cargo test --workspace

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: "nix develop .#ci --command {0}"
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Not run with RUSTDOCFLAGS=-D warnings: many crates already carry
      # pre-existing broken-intra-doc-link warnings unrelated to #273 (e.g.
      # ene-ai, ene-voice, apps/ene-desktop). Turning warnings into hard
      # errors here would fail CI on unrelated debt instead of catching new
      # breakage. See the #273 PR description for the follow-up.
      - name: Build docs
        run: nix develop .#ci --command cargo doc --workspace --no-deps

  # Keep the two newest rust-cache generations per job, run after the
  # caching jobs save theirs.
  cache-prune:
    name: Prune rust caches
    if: github.ref == 'refs/heads/main'
    needs: [clippy, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Prune stale rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep_per_job=2
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | [.id, .key, .created_at] | @tsv' \
          | sort -k3,3r \
          | awk -v keep="$keep_per_job" '
              { job = $2; sub(/^v0-rust-/, "", job); sub(/-Linux-.*/, "", job) }
              count[job]++ < keep { next }
              { print $1 }' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null
              deleted=$((deleted + 1))
            done
          echo "Deleted ${deleted} stale rust-cache entries."
