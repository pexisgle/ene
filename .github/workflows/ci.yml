name: PR maintenance

on:
  pull_request:

jobs:
  probe-pr-895-port:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe broker stack port onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main \
            38ee0eab1759c0335a14391ef3dda10cd23e24e7 \
            b59f9615abbf1db867fe9c63a7731767ca44dbc8 \
            ef439c0593f086a177f057fa07e37ffc2f53e0d9 \
            16ab7d261fca65fc212d94e46597bc83f3429132 \
            337078c4ab6a8a7708d5663bbf75f7aa4de7cc61 \
            b4c5c586e7f668293319ca996d00e3738a55cc9b
          git reset --hard origin/main
          for commit in \
            38ee0eab1759c0335a14391ef3dda10cd23e24e7 \
            b59f9615abbf1db867fe9c63a7731767ca44dbc8 \
            ef439c0593f086a177f057fa07e37ffc2f53e0d9 \
            16ab7d261fca65fc212d94e46597bc83f3429132 \
            337078c4ab6a8a7708d5663bbf75f7aa4de7cc61 \
            b4c5c586e7f668293319ca996d00e3738a55cc9b; do
            echo "=== cherry-pick $commit ==="
            if ! git cherry-pick "$commit"; then
              echo "=== conflicts ==="
              git status --short
              git diff --cc
              exit 1
            fi
          done
          echo '=== broker stack ports cleanly ==='
          git log --oneline -7
