name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Mirrors the Linux buildInputs of the nix devShell (flake.nix) minus
      # Windows cross, Chromium, sccache, and git-cliff.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang mold libssl-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev \
            libvulkan-dev libshaderc-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libayatana-appindicator3-dev libxdo-dev
      - name: Prepare build environment
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang --version | sed -nE 's/.*clang version ([0-9]+)\..*/\1/p')/lib" >> "$GITHUB_ENV"
          # .cargo/config.toml sets build.rustc-wrapper = "sccache"; an empty
          # env value overrides it since sccache is not installed here.
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # Failed runs must not persist partial caches.
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang mold libssl-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev \
            libvulkan-dev libshaderc-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libayatana-appindicator3-dev libxdo-dev
      - name: Prepare build environment
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang --version | sed -nE 's/.*clang version ([0-9]+)\..*/\1/p')/lib" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: cargo test --workspace

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang mold libssl-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev \
            libvulkan-dev libshaderc-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgtk-3-dev libglib2.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libayatana-appindicator3-dev libxdo-dev
      - name: Prepare build environment
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang --version | sed -nE 's/.*clang version ([0-9]+)\..*/\1/p')/lib" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Not run with RUSTDOCFLAGS=-D warnings: many crates already carry
      # pre-existing broken-intra-doc-link warnings unrelated to #273 (e.g.
      # ene-ai, ene-voice, apps/ene-desktop). Turning warnings into hard
      # errors here would fail CI on unrelated debt instead of catching new
      # breakage. See the #273 PR description for the follow-up.
      - name: Build docs
        run: cargo doc --workspace --no-deps

  # Keep the two newest rust-cache generations per job, run after the
  # caching jobs save theirs.
  cache-prune:
    name: Prune rust caches
    if: github.ref == 'refs/heads/main'
    needs: [clippy, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Prune stale rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep_per_job=2
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | [.id, .key, .created_at] | @tsv' \
          | sort -k3,3r \
          | awk -v keep="$keep_per_job" '
              { job = $2; sub(/^v0-rust-/, "", job); sub(/-Linux-.*/, "", job) }
              count[job]++ < keep { next }
              { print $1 }' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null
              deleted=$((deleted + 1))
            done
          echo "Deleted ${deleted} stale rust-cache entries."
