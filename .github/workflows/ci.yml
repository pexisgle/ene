name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/rust-build-env
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group:
          # Every workspace package belongs to exactly one group; the union
          # is the full `cargo test --workspace` surface. Splitting the job
          # isolates a flaky/slow package so a rerun targets one group.
          - name: core
            packages: >-
              -p ene-ai -p ene-card -p ene-config -p ene-connector -p ene-core
              -p ene-infer -p ene-mind -p ene-plugin -p ene-plugin-db
              -p ene-plugin-host -p ene-plugin-macros -p ene-plugin-proto
              -p ene-rag -p ene-runtime -p ene-store -p ene-util
              -p ene-voice -p ene-vrm
          - name: apps
            packages: -p ene-cli -p ene-desktop
          - name: plugins
            packages: >-
              -p ene-plugin-anthropic -p ene-plugin-edge-tts
              -p ene-plugin-elevenlabs -p ene-plugin-kokoro
              -p ene-plugin-llama-cpp -p ene-plugin-llama-server
              -p ene-plugin-onnx -p ene-plugin-openai
              -p ene-plugin-openai-tts -p ene-plugin-voicevox
              -p ene-plugin-whisper -p ene-plugin-app
              -p ene-plugin-browser -p ene-plugin-calc
              -p ene-plugin-calendar -p ene-plugin-counter
              -p ene-plugin-fs -p ene-plugin-geo -p ene-plugin-git
              -p ene-plugin-homeassistant -p ene-plugin-random
              -p ene-plugin-utility -p ene-plugin-web
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-env
      - name: Run tests
        run: cargo test ${{ matrix.group.packages }}

  # GPU backends are compile-only in CI (no GPU hardware): the workspace no
  # longer enables llama.cpp's vulkan feature through ene-cli/ene-desktop, so
  # this job keeps the GPU code paths compiling. The cuda feature has no
  # compile coverage here — a CUDA toolkit is not installed on the runner —
  # matching the pre-relocation setup where cuda was never built by CI either.
  local-llm-gpu-compile:
    name: Local LLM GPU compile (vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-env
      - name: Compile the local-llm plugin with the vulkan backend
        run: cargo check -p ene-plugin-llama-cpp --features vulkan

  docs:
    name: Doc build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-build-env
      # Not run with RUSTDOCFLAGS=-D warnings: many crates already carry
      # pre-existing broken-intra-doc-link warnings unrelated to #273 (e.g.
      # ene-ai, ene-voice, apps/ene-desktop). Turning warnings into hard
      # errors here would fail CI on unrelated debt instead of catching new
      # breakage. See the #273 PR description for the follow-up.
      - name: Build docs
        run: cargo doc --workspace --no-deps

  # Keep the two newest rust-cache generations per job, run after the
  # caching jobs save theirs.
  cache-prune:
    name: Prune rust caches
    if: github.ref == 'refs/heads/main'
    needs: [clippy, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Prune stale rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep_per_job=2
          gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | [.id, .key, .created_at] | @tsv' \
          | sort -k3,3r \
          | awk -v keep="$keep_per_job" '
              { job = $2; sub(/^v0-rust-/, "", job); sub(/-Linux-.*/, "", job) }
              count[job]++ < keep { next }
              { print $1 }' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null
              deleted=$((deleted + 1))
            done
          echo "Deleted ${deleted} stale rust-cache entries."
