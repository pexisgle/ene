name: PR maintenance

on:
  pull_request:

jobs:
  fix-pr-828-shared-lint:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove obsolete shared-source lint suppression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold clang
          git fetch origin cursor/fs-glob-delete-broker-860b
          git checkout -B repair-828 origin/cursor/fs-glob-delete-broker-860b
          python3 - <<'PY'
          from pathlib import Path
          path = Path('plugins/tool/fs/src/logic.rs')
          text = path.read_text()
          if '#[allow(dead_code)]' not in text:
              raise SystemExit('expected dead_code suppression not found')
          path.write_text(text.replace('#[allow(dead_code)]\n', ''))
          PY
          cargo fmt --all
          cargo clippy -p ene-registry -p ene-tool-fs --all-targets -- -D warnings
          git add plugins/tool/fs/src/logic.rs
          git commit -m 'fix(fs): remove obsolete shared-source lint suppression'
          git push origin HEAD:cursor/fs-glob-delete-broker-860b
