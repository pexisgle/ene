name: PR maintenance

on:
  pull_request:

jobs:
  fix-pr-828-shared-source-lint:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add narrow dead-code allowances for host-only shared-source items
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin cursor/fs-glob-delete-broker-860b
          git checkout -B repair origin/cursor/fs-glob-delete-broker-860b
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/tool/fs/src/logic.rs')
          s = p.read_text()
          guard = 'struct WorkspaceOverrideGuard(Option<PathBuf>);'
          func = 'pub fn with_workspace<T>('
          if guard not in s or func not in s:
              raise SystemExit('host workspace anchors missing')
          if '#[allow(dead_code)]\nstruct WorkspaceOverrideGuard' not in s:
              s = s.replace(guard, '// Used when this source is included by ene-registry; unused in the standalone plugin binary.\n#[allow(dead_code)]\n' + guard, 1)
          if '#[allow(dead_code)]\npub fn with_workspace' not in s:
              s = s.replace(func, '// Host-only entry point; the standalone plugin build does not call it.\n#[allow(dead_code)]\n' + func, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git add plugins/tool/fs/src/logic.rs
          git commit -m 'fix(fs): scope shared-source dead-code allowances'
          git push origin HEAD:cursor/fs-glob-delete-broker-860b
