name: PR maintenance

on:
  pull_request:

jobs:
  diagnose-pr-873:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Diagnose PR 873 against current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin a0cb05bf7f59cc7cd2cea422bf7ce6a21af4b116
          git fetch origin 7124865e4f6383d1910919d4359e02cabb1fd898
          git diff --binary a0cb05bf7f59cc7cd2cea422bf7ce6a21af4b116 7124865e4f6383d1910919d4359e02cabb1fd898 > /tmp/pr-873.patch
          git reset --hard origin/main
          if git apply --3way --index /tmp/pr-873.patch; then
            echo 'PR873_APPLIES_CLEANLY'
          else
            echo '=== PR 873 CONFLICTS ==='
            git status --short
            git diff --cc || true
            exit 1
          fi
