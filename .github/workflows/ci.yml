name: PR maintenance

on:
  pull_request:

jobs:
  fix-pr-828-lint:
    if: github.head_ref == 'tmp-placeholder-never-use'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix PR 828 host workspace entry point visibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin cursor/fs-glob-delete-broker-860b
          git checkout -B repair origin/cursor/fs-glob-delete-broker-860b
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/tool/fs/src/logic.rs')
          s = p.read_text()
          old = 'pub(crate) fn with_workspace<T>('
          if old not in s:
              raise SystemExit('with_workspace visibility anchor missing')
          p.write_text(s.replace(old, 'pub fn with_workspace<T>(', 1))
          PY
          cargo fmt --all
          git add plugins/tool/fs/src/logic.rs
          git commit -m 'fix(fs): expose host workspace execution entry point'
          git push origin HEAD:cursor/fs-glob-delete-broker-860b
