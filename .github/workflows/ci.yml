name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@nextest
      - name: Install desktop GUI native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Integration tests spawn `ene-ctl` / `ene-core` from `target/debug`.
      # clippy and nextest do not link those product binaries.
      - name: Build workspace binaries
        run: cargo build --locked --workspace --bins
      - name: Run tests
        run: cargo nextest run --locked --workspace --no-fail-fast
      - name: Run Host test-support regressions
        run: |
          cargo test --locked -p ene-core --features test-support --lib action::supervisor_tests
          cargo test --locked -p ene-core --features test-support --test stage6_e2e
      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --locked --workspace --doc
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps

  check-windows:
    name: Check Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Run Host test-support regressions
        run: |
          cargo test --locked -p ene-core --features test-support --lib action::supervisor_tests
          cargo test --locked -p ene-core --features test-support --test stage6_e2e windows_junction_staging_root_is_rejected_without_deleting_its_target -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e supported_host_runtime_action_smoke_uses_the_packaged_worker -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e stale_worker_protocol_is_rejected_before_au5_and_staging -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e host_shutdown_kills_reaps_and_joins_uncooperative_task_effect_before_returning -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e host_shutdown_reports_staging_cleanup_failure_and_keeps_the_obligation -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e shutdown_before_task_agent_action_start_creates_no_attempt_or_workspace_effect -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e action_claim_first_keeps_started_fact_and_completed_effect_across_shutdown -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e shutdown_during_staging_preparation_is_bounded_and_claims_no_action -- --exact
          cargo test --locked -p ene-core --features test-support --test stage6_e2e shutdown_during_destructive_staging_cleanup_kills_the_helper_and_reports_obligation -- --exact
