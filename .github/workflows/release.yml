name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cmd-format: "nix develop --command {0}"

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify tag matches workspace version
        run: |
          package_id="$(nix develop --command cargo pkgid -p ene-daemon)"
          cargo_version="${package_id##*@}"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "error: tag version $VERSION does not match Cargo workspace version $cargo_version" >&2
            exit 1
          fi

      - name: Build release binaries
        run: |
          nix develop --command cargo build --release \
            -p ene-daemon \
            -p ene-ctl \
            -p ene-stage \
            -p ene-tool-fs \
            -p ene-tool-exec \
            -p ene-tool-web \
            -p ene-tool-utility \
            -p ene-tool-app \
            -p ene-tool-mcp \
            -p ene-provider-openai-compat \
            -p ene-provider-gguf \
            -p ene-provider-anthropic \
            -p ene-provider-elevenlabs \
            -p ene-provider-voicevox \
            -p ene-provider-edge-tts

      - name: Package Linux artifacts
        run: |
          chmod +x scripts/package-linux-release.sh
          nix develop --command bash scripts/package-linux-release.sh "$VERSION"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            "ene-ctl-${VERSION}-linux-x86_64.tar.gz" \
            "ene-stage_${VERSION}_amd64.deb" > SHA256SUMS

      - name: Generate changelog
        run: |
          nix develop --command git cliff --latest --strip header \
            --config cliff.toml \
            --output CHANGELOG.release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "ene v${{ env.VERSION }}"
          body_path: CHANGELOG.release.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ene-ctl-${{ env.VERSION }}-linux-x86_64.tar.gz
            dist/ene-stage_${{ env.VERSION }}_amd64.deb
            dist/SHA256SUMS
