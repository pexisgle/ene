name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: "nix develop --command {0}"

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify tag matches workspace version
        run: |
          package_id="$(nix develop --command cargo pkgid -p ene-daemon)"
          cargo_version="${package_id##*@}"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "error: tag version $VERSION does not match Cargo workspace version $cargo_version" >&2
            exit 1
          fi

      - name: Build release binaries
        run: |
          nix develop --command cargo build --release \
            -p ene-daemon \
            -p ene-ctl \
            -p ene-stage \
            -p ene-tool-fs \
            -p ene-tool-exec \
            -p ene-tool-web \
            -p ene-tool-utility \
            -p ene-tool-app \
            -p ene-tool-mcp \
            -p ene-provider-openai-compat \
            -p ene-provider-gguf \
            -p ene-provider-anthropic \
            -p ene-provider-elevenlabs \
            -p ene-provider-voicevox \
            -p ene-provider-edge-tts

      - name: Package Linux artifacts
        run: |
          chmod +x scripts/package-linux-release.sh
          nix develop --command bash scripts/package-linux-release.sh "$VERSION"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            "ene-ctl-${VERSION}-linux-x86_64.tar.gz" \
            "ene-stage_${VERSION}_amd64.deb" > SHA256SUMS

      - name: Generate changelog
        run: |
          nix develop --command git cliff --latest --strip header \
            --config cliff.toml \
            --output CHANGELOG.release.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist
            CHANGELOG.release.md

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name release-artifacts --dir release-artifacts

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "ene v${version}" \
            --notes-file release-artifacts/CHANGELOG.release.md \
            --verify-tag \
            "${release_args[@]}" \
            "release-artifacts/dist/ene-ctl-${version}-linux-x86_64.tar.gz" \
            "release-artifacts/dist/ene-stage_${version}_amd64.deb" \
            release-artifacts/dist/SHA256SUMS
