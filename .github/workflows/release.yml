name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: "nix develop --command {0}"

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          nix develop --command cargo build --release \
            -p ene-daemon \
            -p ene-ctl \
            -p ene-stage \
            -p ene-harness-fs \
            -p ene-harness-exec \
            -p ene-harness-web \
            -p ene-harness-utility \
            -p ene-harness-app \
            -p ene-harness-mcp \
            -p ene-provider-openai-compat \
            -p ene-provider-gguf \
            -p ene-provider-anthropic \
            -p ene-provider-elevenlabs \
            -p ene-provider-voicevox \
            -p ene-provider-edge-tts

      - name: Package Linux artifacts
        run: |
          chmod +x scripts/package-linux-release.sh
          nix develop --command bash scripts/package-linux-release.sh "$VERSION"

      - name: Generate changelog
        run: |
          nix develop --command git cliff --latest --strip header \
            --config cliff.toml \
            --output CHANGELOG.release.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ene v${{ env.VERSION }}"
          body_path: CHANGELOG.release.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ene-ctl-${{ env.VERSION }}-linux-x86_64.tar.gz
            dist/ene-stage_${{ env.VERSION }}_amd64.deb
