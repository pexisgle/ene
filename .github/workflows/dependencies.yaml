name: dependencies

# A repository-scoped fine-grained PAT is passed only to the PR actions below.
# Unlike GITHUB_TOKEN, its PRs trigger the normal validation workflows.
permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Generate branch date
        run: echo "CURRENT_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "Update flake.lock"
          pr-labels: |
            dependencies
          pr-reviewers: ${{ github.actor }}
          branch: "deps/update-flake-lock-${{ env.CURRENT_DATE }}"
          commit-msg: "deps: Update flake.lock"
          path-to-flake-dir: ./
          token: ${{ secrets.DEPENDENCIES_PAT }}

  update-cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Generate branch date
        run: echo "CURRENT_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Run cargo update
        run: nix develop --command cargo update
      - name: Create PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DEPENDENCIES_PAT }}
          commit-message: "deps: Update Cargo.lock"
          branch: "deps/update-cargo-${{ env.CURRENT_DATE }}"
          title: "Update Cargo.lock"
          labels: dependencies

  update-rust-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Generate branch date
        run: echo "CURRENT_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV
      - name: Update Rust toolchain sources
        run: |
          scripts/update-rust-toolchain.sh
          nix flake lock --update-input rust-overlay
          nix develop --command rustc --version
      - name: Create PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DEPENDENCIES_PAT }}
          commit-message: "chore(toolchain): update Rust version"
          branch: "deps/update-rust-toolchain-${{ env.CURRENT_DATE }}"
          title: "chore(toolchain): update Rust version"
          labels: dependencies
