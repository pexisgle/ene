name: TMP 869 normalize main

on:
  push:
    branches:
      - cursor/provider-retry-context-860b

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge current main and format
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            {
              echo '=== UNMERGED ==='
              git diff --name-only --diff-filter=U || true
              echo '=== CONFLICT MARKERS ==='
              for f in $(git diff --name-only --diff-filter=U); do
                echo "----- $f -----"
                grep -n -B 12 -A 18 '^<<<<<<<\|^=======\|^>>>>>>>' "$f" || true
              done
            } > /tmp/conflicts.txt
            git merge --abort || true
            cp /tmp/conflicts.txt .tmp-869-conflicts.txt
            git add .tmp-869-conflicts.txt
            git commit -m "ci: refresh PR 869 merge conflicts" || true
            git push origin HEAD:cursor/provider-retry-context-860b
            exit 0
          fi
          cargo fmt --all
          git add -A
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:cursor/provider-retry-context-860b
