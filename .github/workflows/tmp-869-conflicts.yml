name: TMP 869 resolve main

on:
  push:
    branches:
      - cursor/provider-retry-context-860b

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge current main and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            cargo fmt --all
            git add -A
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            git push origin HEAD:cursor/provider-retry-context-860b
            exit 0
          fi

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          printf '%s\n' "${unresolved[@]}" | sort > /tmp/unresolved.txt
          printf '%s\n' \
            apps/ene-core/src/boot.rs \
            apps/ene-core/src/http/model.rs \
            crates/ene-kernel/src/lib.rs | sort > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/unresolved.txt; then
            echo 'unexpected conflict set; refusing automatic resolution'
            exit 1
          fi

          # boot.rs only added CONTEXT_WINDOW parsing to the old hand-written
          # env loader. main replaced that loader with the generic ene-config
          # pipeline, which already handles the setting, so keep main here.
          git checkout --theirs -- apps/ene-core/src/boot.rs

          # Keep the retry/context-packing implementation, then layer the
          # streaming ConversationModel API from main on top of it.
          git checkout --ours -- apps/ene-core/src/http/model.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/ene-core/src/http/model.rs')
          s = p.read_text()
          s = s.replace(
              'ConversationModel, KernelError, ModelGeneration, ModelRequest, TaskBinding, TokenEstimation,\n    ToolCall, effective_window, estimate_tokens, fit_prompt,',
              'ConversationModel, KernelError, ModelGeneration, ModelRequest, TaskBinding, TextDeltaSink,\n    TokenEstimation, ToolCall, effective_window, estimate_tokens, fit_prompt,',
          )
          start = s.index('#[async_trait]\nimpl ConversationModel for SeamedModel {')
          end = s.index('\nfn vision_store_for', start)
          merged = '''#[async_trait]
          impl ConversationModel for SeamedModel {
              async fn generate(&self, request: ModelRequest) -> Result<ModelGeneration, KernelError> {
                  self.generate_on_fiber(request, None).await
              }

              async fn generate_streaming(
                  &self,
                  request: ModelRequest,
                  sink: &mut dyn TextDeltaSink,
              ) -> Result<ModelGeneration, KernelError> {
                  self.generate_on_fiber(request, Some(sink)).await
              }
          }

          impl SeamedModel {
              async fn generate_on_fiber(
                  &self,
                  request: ModelRequest,
                  sink: Option<&mut dyn TextDeltaSink>,
              ) -> Result<ModelGeneration, KernelError> {
                  let binding = self.binding();
                  if binding.is_unconfigured() {
                      return Err(KernelError::Model(format!(
                          "{} model is not configured",
                          self.task
                      )));
                  }
                  let harness = crate::boot::load_harness_settings(self.core.data_dir());
                  let reserve = binding
                      .max_tokens
                      .unwrap_or(harness.context.response_reserve_tokens);
                  let window = effective_window(
                      None,
                      binding.context_window,
                      Some(reserve),
                      harness.context.safety_margin_ratio,
                  );
                  let estimation = harness.context.token_estimation;
                  let store = self.core.store();
                  let vision_store = vision_store_for(&binding, store.as_ref());
                  let tool_overhead = estimate_tool_schema_tokens(&self.core, self.layer(), estimation);
                  let message_budget = window.available.saturating_sub(tool_overhead);
                  if message_budget == 0 {
                      return Err(KernelError::Model(
                          "context window exhausted by tool definitions".to_owned(),
                      ));
                  }
                  let messages = fit_prompt(
                      fold_history(&request.messages, vision_store),
                      message_budget,
                      |message| estimate_message_tokens(message, estimation),
                      |message| matches!(message.role, LlmRole::System),
                  );
                  let llm_request = map_request(
                      messages,
                      &binding,
                      &self.core.secret_for(self.task),
                      &self.core,
                      self.layer(),
                      reserve,
                  );
                  let row_id = crate::plugin_profile::task_row_id(self.fiber_task());
                  let generation = if let Some(sink) = sink {
                      super::llm::generate_llm_streaming(&self.core, &row_id, llm_request, sink).await
                  } else {
                      super::llm::generate_llm(&self.core, &row_id, llm_request).await
                  }
                  .map_err(KernelError::Model)?;
                  Ok(map_generation(generation))
              }
          }
          '''
          # Strip workflow indentation from the embedded Rust block.
          merged = '\n'.join(line[10:] if line.startswith('          ') else line for line in merged.splitlines())
          p.write_text(s[:start] + merged + s[end:])
          PY

          # Keep the retry/context-window modules and exports from this PR while
          # adopting main's LaneMindSettings rename and streaming sink export.
          git checkout --ours -- crates/ene-kernel/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ene-kernel/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'DelegationSettings, HarnessSettings, MindSettings, PluginIpcSettings,',
              'DelegationSettings, HarnessSettings, LaneMindSettings, PluginIpcSettings,',
          )
          s = s.replace(
              'ConversationModel, EchoModel, ModelGeneration, ModelRequest, ToolCall, ToolCallingModel,',
              'ConversationModel, EchoModel, ModelGeneration, ModelRequest, TextDeltaSink, ToolCall,\n    ToolCallingModel,',
          )
          s = s.replace(
              '#[cfg(test)]\nmod tests;',
              '#[cfg(test)]\nmod tests {\n    use crate::LaneMindSettings as MindSettings;\n    include!("tests.rs");\n}',
          )
          p.write_text(s)
          PY

          git add apps/ene-core/src/boot.rs apps/ene-core/src/http/model.rs crates/ene-kernel/src/lib.rs
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'unresolved conflicts remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit --no-edit
          cargo fmt --all
          git add -A
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:cursor/provider-retry-context-860b
