name: TMP 869 merge main

on:
  push:
    branches:
      - cursor/provider-retry-context-860b

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge current main, format, and clean probe files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm -f .github/workflows/tmp-869-conflicts.yml .tmp-869-conflicts.txt
          cargo fmt --all
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:cursor/provider-retry-context-860b
