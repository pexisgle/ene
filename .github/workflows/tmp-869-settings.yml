name: TMP 869 live settings

on:
  push:
    branches:
      - cursor/provider-retry-context-860b

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cursor/provider-retry-context-860b
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Use CoreDaemon live harness settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/ene-core/src/http/model.rs')
          s = p.read_text()
          old = 'let harness = crate::boot::load_harness_settings(self.core.data_dir());'
          if s.count(old) != 1:
              raise SystemExit(f'unexpected model replacement count: {s.count(old)}')
          p.write_text(s.replace(old, 'let harness = self.core.harness();'))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ene-core/src/http/model.rs
          git commit -m "fix(core): use live harness settings for context packing"
          git push origin HEAD:cursor/provider-retry-context-860b
