name: Setup Rust
description: Install the exact Rust toolchain pinned in rust-toolchain.toml.

inputs:
  components:
    description: Comma-separated extra components (rustfmt, clippy).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read pinned toolchain version
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -nE 's/^channel *= *"([^"]+)"/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "error: no pinned channel in rust-toolchain.toml" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    # Pinned by SHA; the comment tracks which release the hash is. A floating
    # ref would defeat the point of pinning the toolchain itself.
    - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}
