name: GUI smoke hook

# Primary wake path for ene GUI確認. Does not need the Grok Bot computer.
# Fire rules live in scripts/gui-smoke-hook.py (same meaning as the old box watcher).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    # weekday daytime JST ≈ UTC 00–12; thin backup if a CI completion was missed
    - cron: "20 0,3,6,9,12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read
  actions: read

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore fired_green state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gui-smoke-hook-state
          key: gui-smoke-hook-state-${{ github.run_id }}
          restore-keys: |
            gui-smoke-hook-state-

      - name: Install gh
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi
          gh --version

      - name: Evaluate open PRs and POST webhook
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.ENE_GUI_SMOKE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.ENE_GUI_SMOKE_WEBHOOK_KEY }}
          REPO: ${{ github.repository }}
          STATE_DIR: .gui-smoke-hook-state
        run: python3 scripts/gui-smoke-hook.py
