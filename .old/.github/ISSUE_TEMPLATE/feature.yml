name: 機能追加 (Feature)
description: 新機能の追加・改善提案
title: "feat(scope): "
labels: ["type:feature", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        新機能の提案ありがとうございます。
        タイトルは Conventional Commits 形式 (`feat(<scope>): <概要>`) で記入してください。

  - type: dropdown
    id: area
    attributes:
      label: 対象エリア (area)
      description: 影響するクレート・領域を選択してください。
      multiple: true
      options:
        - core (ene-session / ene-kernel / ene-core)
        - companion (ene-companion / 記憶・感情)
        - work (ene-work / 委譲・ジョブ)
        - plugin (ene-plugin-host / ene-plugin-ipc / harness)
        - access-control (ene-access-control / 承認・監査)
        - avatar (ene-vrm / アバター)
        - stage (ene-stage)
        - cli (ene-ctl)
        - config (ene-config)
        - security (サンドボックス・承認)
        - infra (インフラ・基盤)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度 (priority)
      description: 対応の優先度を選択してください。
      options:
        - low (低優先度・将来対応)
        - medium (中優先度)
        - high (高優先度)
        - critical (緊急・リリースブロッカー)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 追加したい機能を簡潔に説明してください。
      placeholder: 何ができるようになるか、1〜2文で。
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 目的・背景
      description: なぜこの機能が必要か、解決したい課題を説明してください。
      placeholder: 現状の課題、ユーザー価値、動機など。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 主な変更内容
      description: 想定する実装方針・変更箇所を箇条書きで。
      placeholder: |
        - 設定項目 `companion.foo.*` の追加
        - `ene-companion` に○○モジュールを追加
        - UI の変更点
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了とみなす条件をチェックリストで。
      value: |
        - [ ] 
        - [ ] 
        - [ ] テストが追加され、`cargo test --workspace` が通る
        - [ ] `cargo clippy --workspace -- -D warnings` が通る
        - [ ] `cargo fmt --all -- --check` が通る
        - [ ] 関連ドキュメント (EN/JA) を更新した
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 関連
      description: 関連するissue、PR、ドキュメント、外部リンクなど。
      placeholder: "#123, docs/concepts/xxx.md, https://..."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存issueと重複していないことを確認した
          required: true
        - label: 公開 HTTP/WS API とアーキテクチャ境界 を考慮した
          required: false
