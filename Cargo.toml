[workspace]
members = [
    "crates/*",
    "tools/*",
    "apps/*",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
rand = "0.10"
async-openai = { version = "0.41", default-features = false, features = [
    "chat-completion",
    "embedding",
    "byot",
] }
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order"] }
ctor = "1.0"

# --- Workspace dependencies (shared across crates) ---
dashmap = "6"
base64 = { version = "0.22", default-features = false }
blake3 = "1.8"

# --- Internal libraries ---
ene-mind = { path = "crates/ene-mind" }
ene-config = { path = "crates/ene-config" }
ene-runtime = { path = "crates/ene-runtime" }
ene-ai = { path = "crates/ene-ai" }
ene-store = { path = "crates/ene-store" }
ene-tool-host = { path = "crates/ene-tool-host" }
ene-tool = { path = "crates/ene-tool" }
ene-tool-proto = { path = "crates/ene-tool-proto" }
ene-tool-common = { path = "crates/ene-tool-common" }
ene-tool-derive = { path = "crates/ene-tool-derive" }
ene-tool-db = { path = "crates/ene-tool-db" }
ene-vrm = { path = "crates/ene-vrm" }

# --- Database ---
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.0-rc.41", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1"

# --- Proc macros ---
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
darling = "0.23"

# --- ML / Embedding ---
candle-core = "0.11"
candle-nn = "0.11"
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
accelerate-src = "0.3.2"
tokenizers = "0.23"
hf-hub = { version = "1.0.0-rc.1", default-features = false }

# --- Tooling ---
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
directories = "6"
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
htmd = "0.5"
scraper = "0.27"
ego-tree = "0.11"

# --- Cross-cutting (used by 2+ crates) ---
arboard = { version = "3.6", features = ["wayland-data-control"] }
parking_lot = "0.12"
png = "0.18"
tray-icon = { version = "0.24", default-features = false }
rust-embed = "8.11"
i18n-embed = { version = "0.16", features = ["fluent-system", "fluent", "desktop-requester"] }
i18n-embed-fl = "0.10"

# --- Rendering stack (ene-desktop-v2: winit + wgpu + egui) ---
winit = "0.30"
wgpu = "29"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false }
encase = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"
rapier3d = { version = "0.33", features = ["simd-stable"] }

# --- bevy_ecs (scheduler-only; no bevy_engine rendering/winit) ---
bevy_ecs = { version = "0.19", default-features = false }
bevy_app = { version = "0.19", default-features = false }
rayon = "1.12"
bitflags = "2"
image = { version = "0.25", default-features = false }
reqwest = { version = "0.13", default-features = false }
tempfile = "3"
zip = { version = "8", default-features = false }

# --- Linux display-server integration ---
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["staging", "client"] }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
x11rb = { version = "0.13", default-features = false }

[workspace.metadata.cargo-husky]
run-for-all = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ene-ai]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
allow_attributes = "warn"

# --- Cast lints: intentional in systems programming and rendering code ---
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# --- Subjective style lints: legitimate use cases exist in this codebase ---
too_many_lines = "allow"
items_after_statements = "allow"
too_long_first_doc_paragraph = "allow"

# --- Domain-appropriate lints ---
struct_excessive_bools = "allow"
large_futures = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
