[workspace]
members = [
    "crates/*",
    "tools/*",
    "apps/*",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
rand = "0.10.1"
async-openai = { version = "0.41", default-features = false, features = [
    "chat-completion",
    "embedding",
] }
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order"] }
ctor = "1.0"

# --- Workspace dependencies (shared across crates) ---
dashmap = "6"
base64 = "0.22"

# --- Internal libraries ---
ene-common = { path = "crates/ene-common" }
ene-config = { path = "crates/ene-config" }
ene-core = { path = "crates/ene-core" }
ene-embedding = { path = "crates/ene-embedding" }
ene-memory = { path = "crates/ene-memory" }
ene-session = { path = "crates/ene-session" }
ene-provider = { path = "crates/ene-provider" }
ene-tool-host = { path = "crates/ene-tool-host" }
ene-tool-proto = { path = "crates/ene-tool-proto" }
ene-tool-common = { path = "crates/ene-tool-common" }
ene-tool-derive = { path = "crates/ene-tool-derive" }
ene-tool-db = { path = "crates/ene-tool-db" }
blake3 = "1.5"

# --- Database ---
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
sqlite-vec = "0.1"

# --- Proc macros ---
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
darling = "0.20"

# --- ML / Embedding ---
candle-core = "0.10"
candle-nn = "0.10"
tokenizers = "0.23"
hf-hub = { version = "0.5.0", default-features = false }

# --- Tooling ---
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
directories = "6"
rmcp = { version = "1.7", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
htmd = "0.5"
scraper = "0.27"
ego-tree = "0.11"

# --- Cross-cutting (used by 2+ crates) ---
arboard = { version = "3.6", features = ["wayland-data-control"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

# Git hooks installed by `cargo-husky` on the first `cargo build`.
# Hooks live under `.cargo-husky/hooks/` and are auto-installed for the
# workspace, so every contributor gets them with no manual setup.
# The actual dev-dep lives on a host crate (ene-core) because virtual
# workspace manifests cannot carry `[dev-dependencies]`.
[workspace.metadata.cargo-husky]
run-for-all = true
