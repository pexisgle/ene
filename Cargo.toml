[workspace]
members = [
    "crates/*",
    "apps/*",
    "plugins/tool/*",
    "plugins/provider/*",
]
# Python IPC fixture (not a Cargo package).
exclude = ["plugins/tool/dummy-py"]
default-members = [ "apps/ene-ctl" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pexisgle/ene"
publish = false

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

bytemuck = { version = "1", features = ["derive"] }
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false }
image = { version = "0.25", default-features = false }
pollster = "1.0"
wgpu = "29"
rustfft = "6"

global-hotkey = "0.8"
rfd = "0.15"
cpal = "0.18"
rodio = { version = "0.22", default-features = false }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
crossbeam-channel = "0.5"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "fluent", "desktop-requester"] }
i18n-embed-fl = "0.10"

base64 = { version = "0.23", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.6"
cron = "0.17"
iana-time-zone = "0.1"
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }

tracing = "0.1"
tracing-subscriber = "0.3"

clap = { version = "4", features = ["derive"] }

reqwest = { version = "0.13", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"
webpki-roots = "0.26"

fs2 = "0.4"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"

landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

sys-locale = "0.3"

blake3 = "1.8"
flate2 = "1"
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
directories = "6"
hex = "0.4"
sha2 = "0.11"
rand = "0.10"
arboard = "3.6"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
rayon = "1.12"
regex = "1"
rg-regex = { package = "regex", version = "1" }
rust-embed = "8.11"
tempfile = "3"
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
tray-icon = { version = "0.24", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
ctor = "1.0"
thiserror = "2.0"
zip = { version = "8", default-features = false }
png = "0.18"
toml = "0.8"
htmd = "0.5"
scraper = "0.23"
diffy = "0.4"
globset = "0.4"
ignore = "0.4"
strsim = "0.11"

ene-api = { path = "crates/ene-api" }
ene-card = { path = "crates/ene-card" }
ene-config = { path = "crates/ene-config" }
ene-session = { path = "crates/ene-session" }
ene-kernel = { path = "crates/ene-kernel" }
ene-daemon = { path = "apps/ene-core" }
ene-plugin-ipc = { path = "crates/ene-plugin-ipc" }
ene-provider-assets = { path = "crates/ene-provider-assets" }
ene-registry = { path = "crates/ene-registry" }
ene-fiber = { path = "crates/ene-fiber" }
ene-plane = { path = "crates/ene-plane" }
ene-companion = { path = "crates/ene-companion" }
ene-body = { path = "crates/ene-body" }
ene-work = { path = "crates/ene-work" }
ene-sandbox = { path = "crates/ene-sandbox" }
ene-vrm = { path = "crates/ene-vrm" }
ene-tray-linux = { path = "crates/ene-tray-linux" }

[workspace.metadata.cargo-husky]
run-for-all = true

[workspace.lints.clippy]
# `restriction` is an opt-in menu, not a group to deny wholesale; its lints are
# adopted one by one below.
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
large_futures = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# Exceptions are `#[expect(lint, reason = "...")]`, scoped as narrowly as
# possible — never a workspace-wide allow.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ash]
opt-level = 2

[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.egui-wgpu]
opt-level = 2

[profile.dev.package.egui-winit]
opt-level = 2

[profile.dev.package.glam]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.rapier3d]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
overflow-checks = true
