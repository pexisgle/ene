[workspace]
members = [
    "crates/ene-ai-core",
    "crates/ene-config",
    "crates/ene-embedding",
    "crates/ene-memory",
    "crates/ene-session",
    "crates/ene-tool-*",
    "crates/ene-tools/*",
    "apps/*",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
rand = "0.10.1"
async-openai = { version = "0.40.2", features = ["chat-completion", "embedding"] }

# --- 内部ライブラリ ---
ene-config = { path = "crates/ene-config" }
ene-ai-core = { path = "crates/ene-ai-core" }
ene-embedding = { path = "crates/ene-embedding" }
ene-memory = { path = "crates/ene-memory" }
ene-session = { path = "crates/ene-session" }
ene-tool-host = { path = "crates/ene-tool-host" }
ene-tool-proto = { path = "crates/ene-tool-proto" }
ene-tools-common = { path = "crates/ene-tools/common" }
ene-tools-utility = { path = "crates/ene-tools/utility" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
