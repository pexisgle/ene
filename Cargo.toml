[workspace]
members = [
    "crates/ene-ai-core",
    "crates/ene-config",
    "crates/ene-embedding",
    "crates/ene-memory",
    "crates/ene-session",
    "crates/ene-tool-host",
    "crates/ene-app",
    "crates/ene-cli",
    "crates/ene-tool-proto",
    "crates/ene-tools/utility",
    "crates/ene-tools/web",
    "crates/ene-tools/app",
    "crates/ene-tools/browser",
    "crates/ene-tools/fs",
    "crates/ene-tools/common",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
rand = "0.10.1"
async-openai = { version = "0.40.2", features = ["chat-completion", "embedding"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
