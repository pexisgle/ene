[workspace]
members = [
    "crates/*",
    "apps/*",
    "plugins/provider/*",
    "plugins/tool/*",
    "plugins/harness/*",
]
default-members = [ "apps/ene-cli" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pexisgle/ene"
publish = false

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"

llama-cpp-4 = { version = "0.4.2", default-features = false }
encoding_rs = "0.8"
# Local voice pipeline (STT/TTS/VAD); opt-in via ene-ai feature flags.
whisper-rs = "0.16"
ort = { version = "2.0.0-rc.12", default-features = false }

bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false }
image = { version = "0.25", default-features = false }
wgpu = "29"

global-hotkey = "0.8"
rfd = "0.15"

cpal = "0.18"
hound = "3"
nanomp3 = "0.1.1"
rodio = { version = "0.22", default-features = false }
rustfft = "6"

libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sqlite-vec = "0.1"

base64 = { version = "0.23", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.6"
cron = "0.17"
iana-time-zone = "0.1"
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }

tracing = "0.1"
tracing-subscriber = "0.3"

clap = { version = "4", features = ["derive"] }
crossterm = "0.29"

http = "1"
eventsource-stream = "0.2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false }
scraper = "0.27"
quick-xml = { version = "0.41", features = ["serialize"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2"
unicode-segmentation = "1"
webpki-roots = "0.26"

# zbus (async D-Bus) backend pinned explicitly instead of the default
# features, so a future notify-rust feature reshuffle cannot silently
# change the notification transport. Linux (D-Bus) only: the macOS/Windows
# backends are target-gated, never feature-gated, so they are inert here.
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
proc-macro2 = "1"
quote = "1"
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
syn = { version = "3", features = ["full", "extra-traits"] }

# Vendored libgit2: needs only a C compiler plus system zlib headers
# (libz-sys); no libgit2 system package required.
git2 = { version = "0.21", features = ["vendored-libgit2"] }

crossbeam-channel = "0.5"
dashmap = "6"
fs2 = "0.4"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "rand_core"] }
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

ego-tree = "0.11"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
htmd = "0.5"
sys-locale = "0.3"
unicode-normalization = "0.1"
strsim = "0.11"

blake3 = "1.8"
bytesize = "2"
flate2 = "1"
meval = "0.2"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
directories = "6"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
rayon = "1.12"
regex = "1"
globset = "0.4"
tempfile = "3"

cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
ctor = "1.0"
insta = "1"
proptest = "1"
thiserror = "2.0"
zip = { version = "8", default-features = false }
toml = "0.8"

ene-connector = { path = "crates/ene-connector" }
ene-ai = { path = "crates/ene-ai" }
ene-approval = { path = "crates/ene-approval" }
ene-artifact = { path = "crates/ene-artifact" }
ene-card = { path = "crates/ene-card" }
ene-config = { path = "crates/ene-config" }
ene-core = { path = "crates/ene-core" }
ene-session = { path = "crates/ene-session" }
ene-kernel = { path = "crates/ene-kernel" }
ene-daemon = { path = "apps/ene-core" }
ene-infer = { path = "crates/ene-infer" }
ene-mind = { path = "crates/ene-mind" }
ene-plugin = { path = "crates/ene-plugin" }
ene-plugin-broker = { path = "crates/ene-plugin-broker" }
ene-plugin-db = { path = "crates/ene-plugin-db" }
ene-plugin-host = { path = "crates/ene-plugin-host" }
ene-plugin-ipc = { path = "crates/ene-plugin-ipc" }
ene-plugin-macros = { path = "crates/ene-plugin-macros" }
ene-plugin-proto = { path = "crates/ene-plugin-proto" }
ene-registry = { path = "crates/ene-registry" }
ene-fiber = { path = "crates/ene-fiber" }
ene-plane = { path = "crates/ene-plane" }
ene-companion = { path = "crates/ene-companion" }
ene-body = { path = "crates/ene-body" }
ene-work = { path = "crates/ene-work" }
ene-rag = { path = "crates/ene-rag" }
ene-runtime = { path = "crates/ene-runtime" }
ene-sandbox = { path = "crates/ene-sandbox" }
ene-store = { path = "crates/ene-store" }
ene-util = { path = "crates/ene-util" }
ene-voice = { path = "crates/ene-voice" }
ene-vrm = { path = "crates/ene-vrm" }

[workspace.metadata.cargo-husky]
run-for-all = true

[workspace.lints.clippy]
# `restriction` is an opt-in menu, not a group to deny wholesale; its lints are
# adopted one by one below.
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
large_futures = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# Exceptions are `#[expect(lint, reason = "...")]`, scoped as narrowly as
# possible — never a workspace-wide allow.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ash]
opt-level = 2

[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.egui-wgpu]
opt-level = 2

[profile.dev.package.egui-winit]
opt-level = 2

[profile.dev.package.glam]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.rapier3d]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# `panic = "abort"` is deliberately omitted: ene-runtime's actor relies on
# catch_unwind isolation (crates/ene-runtime/src/handle/actor.rs, and
# docs/concepts/architecture.md "Process model and fault tolerance"). Do not add it.
strip = true
overflow-checks = true
