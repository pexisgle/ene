[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# External dependency version policy for workspace crates.
[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
# Real OS credential store adapter for the first-party GUI setup path
# (Windows Credential Manager, Linux Secret Service). Provisional per
# first-party-desktop §7.4; the port and its fault-injection tests stay
# independent of it.
keyring = { version = "4", default-features = false, features = ["v1"] }
# Provisional preferred text GUI for `apps/ene-desktop` only (winit,
# Royalty-free Desktop + AboutSlint). Not a Host or Body dependency.
slint = { version = "1.14", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "accessibility"] }
slint-build = "1.14"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Windows-only volume identity for the Action filesystem boundary, plus the
# Stage 5 named-pipe transport (explicit DACL, peer token check).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }
# Stage 7 D: Body is the only process that owns a GPU device. OS overlay
# dependencies remain confined to that package.
wgpu = "27"
libc = "0.2"
glam = "0.29"
vrm-runtime = "0.1.0"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", default-features = false }
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

# Skip full debuginfo in the default dev profile. Line tables keep usable
# backtraces; dependency crates do not need even that. This is the compile and
# link cost that otherwise dominates a cold `cargo test --workspace`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
