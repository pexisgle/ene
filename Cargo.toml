[workspace]
members = ["crates/ene-primitive", "crates/ene-config", "crates/ene-api", "crates/ene-presence", "crates/ene-presentation", "crates/ene-companion", "crates/ene-permission", "crates/ene-credential", "crates/ene-inference", "crates/ene-plugin-ipc", "crates/ene-store", "apps/ene-core", "apps/ene-ctl"]
# Retired implementation. Never add members under .old/.
exclude = [".old"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pexisgle/ene"
publish = false

# Shared version policy for M1 foundation crates. Add entries only when a
# second package needs the same dependency (AGENTS.md).
[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
figment = { version = "0.10", features = ["json"] }
schemars = { version = "1.2", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
# `restriction` is an opt-in menu, not a group to deny wholesale; its lints are
# adopted one by one below.
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
large_futures = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# Exceptions are `#[expect(lint, reason = "...")]`, scoped as narrowly as
# possible — never a workspace-wide allow. In tests, `unwrap`/`expect()` on
# Test values still needs such a narrow `#[expect]`; this keeps
# `unwrap_used`/`expect_used` green without weakening the policy.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
