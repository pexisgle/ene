[workspace]
members = [
    "crates/ene-primitive",
    "crates/ene-config",
    "crates/ene-api",
    "apps/ene-core",
    "apps/ene-ctl",
]
# Retired implementation. Never add members under .old/.
exclude = [".old"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# External dependency version policy for workspace crates.
[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
figment = { version = "0.10", features = ["json"] }
schemars = { version = "1.2", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
# Standard Clippy (`all` at warn) is the gate via
# `cargo clippy --workspace --all-targets -- -D warnings`.
# `restriction` is opt-in; only lints with a concrete safety or
# correctness problem are denied here. Do not enable `pedantic` or
# `cargo` wholesale, and do not add workspace-wide allows to paper
# over them. Tests may `unwrap`/`expect`/`panic` via clippy.toml.
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
