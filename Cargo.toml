[workspace]
members = [
    "crates/ene-primitive",
    "crates/ene-config",
    "crates/ene-api",
    "crates/ene-presence",
    "crates/ene-presentation",
    "crates/ene-companion",
    "crates/ene-permission",
    "crates/ene-credential",
    "crates/ene-inference",
    "crates/ene-plugin-ipc",
    "crates/ene-store",
    "apps/ene-core",
    "apps/ene-ctl",
]
# Retired implementation. Never add members under .old/.
exclude = [".old"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# External dependency version policy for workspace crates.
[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
figment = { version = "0.10", features = ["json"] }
schemars = { version = "1.2", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"
