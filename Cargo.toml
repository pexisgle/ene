[workspace]
members = [ "crates/*", "tools/*", "apps/*" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# ── Async / Runtime ──
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# ── AI / LLM ──
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "embedding", "byot"] }
llama-cpp-2 = { version = "0.1.151", default-features = false }
encoding_rs = "0.8"

# ── GUI / Rendering / 3D ──
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false }
image = { version = "0.25", default-features = false }
wgpu = "29"

# ── Database ──
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sea-orm = { version = "2.0.0-rc.43", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.0-rc.43", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sqlite-vec = "0.1"

# ── Serialization / Config ──
base64 = { version = "0.22", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# ── Logging ──
tracing = "0.1"
tracing-subscriber = "0.3"

# ── Terminal / CLI ──
crossterm = "0.29"

# ── Networking ──
reqwest = { version = "0.13", default-features = false }
scraper = "0.27"

# ── IPC / Tool System ──
darling = "0.23"
proc-macro2 = "1"
quote = "1"
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client"] }
syn = { version = "2", features = ["full", "extra-traits"] }

# ── Data Structures ──
dashmap = "6"
indexmap = "2"
once_cell = "1"
parking_lot = "0.12"

# ── Text Processing ──
ego-tree = "0.11"
htmd = "0.5"
unicode-normalization = "0.1"

# ── Utility ──
blake3 = "1.8"
directories = "6"
rand = "0.10"
rayon = "1.12"
regex = "1"
tempfile = "3"

# ── Dev Tooling ──
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
ctor = "1.0"
thiserror = "2.0"
zip = { version = "8", default-features = false }

# ── Internal crates ──
ene-ai = { path = "crates/ene-ai" }
ene-config = { path = "crates/ene-config" }
ene-mind = { path = "crates/ene-mind" }
ene-runtime = { path = "crates/ene-runtime" }
ene-store = { path = "crates/ene-store" }
ene-tool = { path = "crates/ene-tool" }
ene-tool-common = { path = "crates/ene-tool-common" }
ene-tool-db = { path = "crates/ene-tool-db" }
ene-tool-derive = { path = "crates/ene-tool-derive" }
ene-tool-host = { path = "crates/ene-tool-host" }
ene-tool-proto = { path = "crates/ene-tool-proto" }
ene-tool-rag = { path = "crates/ene-tool-rag" }
ene-vrm = { path = "crates/ene-vrm" }

[workspace.metadata.cargo-husky]
run-for-all = true

[workspace.lints.clippy]
all         = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }

implicit_return = "allow"
single_call_fn = "allow"
missing_inline_in_public_items = "allow"
mod_module_files = "allow"
self_named_module_files = "allow"
pub_use = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
alloc_instead_of_core = "allow"
separated_literal_suffix = "allow"
unseparated_literal_suffix = "allow"
question_mark_used = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
missing_trait_methods = "allow"
blanket_clippy_restriction_lints = "allow"
arbitrary_source_item_ordering = "allow"
str_to_string = "allow"
doc_paragraphs_missing_punctuation = "allow"
iter_over_hash_type = "allow"
wildcard_enum_match_arm = "allow"
missing_assert_message = "allow"
inline_trait_bounds = "allow"
impl_trait_in_params = "allow"
unused_trait_names = "allow"
cargo_common_metadata = "allow"

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
as_conversions = "allow"

missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_docs_in_private_items = "allow"

too_many_lines = "allow"
items_after_statements = "allow"
too_long_first_doc_paragraph = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
large_futures = "allow"
min_ident_chars = "allow"
single_char_lifetime_names = "allow"
exhaustive_structs = "allow"
exhaustive_enums = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"

float_arithmetic = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
modulo_arithmetic = "allow"
default_numeric_fallback = "allow"
pattern_type_mismatch = "allow"
print_stdout = "allow"
print_stderr = "allow"
non_ascii_literal = "allow"
else_if_without_else = "allow"
map_err_ignore = "allow"
clone_on_ref_ptr = "allow"
string_add = "allow"
absolute_paths = "allow"
partial_pub_fields = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
missing_asserts_for_indexing = "allow"
exit = "allow"
pub_with_shorthand = "allow"
same_name_method = "allow"
little_endian_bytes = "allow"
big_endian_bytes = "allow"
needless_raw_strings = "allow"
semicolon_outside_block = "allow"
if_then_some_else_none = "allow"
field_scoped_visibility_modifiers = "allow"
ref_patterns = "allow"
cognitive_complexity = "allow"
inline_modules = "allow"
unneeded_field_pattern = "allow"
return_and_then = "allow"
redundant_type_annotations = "allow"
multiple_inherent_impl = "allow"
empty_structs_with_brackets = "allow"
filetype_is_file = "allow"
redundant_test_prefix = "allow"
assertions_on_result_states = "allow"
use_debug = "allow"
tests_outside_test_module = "allow"
mem_forget = "allow"
decimal_literal_representation = "allow"
renamed_function_params = "allow"

allow_attributes_without_reason = "deny"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ene-ai]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
