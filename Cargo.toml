[workspace]
members = [ "crates/*", "tools/*", "apps/*" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = "0.23"
sqlite-vec = "0.1"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
wgpu = "29"
winit = "0.30"
active-win-pos-rs = "0.11.0"
device_query = "4"
enigo = "0.6"
gtk = "0.18.2"
pipewire = "0.9"
xcap = "0.9.6"
websearch = "0.1.1"
async-trait = "0.1"
bitflags = "2"
blake3 = "1.8"
chromiumoxide = "0.9"
console = "0.16.3"
ctor = "1.0"
darling = "0.23"
dashmap = "6"
dialoguer = "0.12"
directories = "6"
ego-tree = "0.11"
flate2 = "1"
futures-core = "0.3"
glob = "0.3"
htmd = "0.5"
i18n-embed-fl = "0.10"
indexmap = "2"
once_cell = "1"
parking_lot = "0.12"
png = "0.18"
pollster = "1.0"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
rayon = "1.12"
regex = "1"
rust-embed = "8.11"
scraper = "0.27"
serde_json = "1"
strsim = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
walkdir = "2"

[workspace.dependencies.ene-ai]
path = "crates/ene-ai"

[workspace.dependencies.ene-config]
path = "crates/ene-config"

[workspace.dependencies.ene-mind]
path = "crates/ene-mind"

[workspace.dependencies.ene-runtime]
path = "crates/ene-runtime"

[workspace.dependencies.ene-store]
path = "crates/ene-store"

[workspace.dependencies.ene-tool]
path = "crates/ene-tool"

[workspace.dependencies.ene-tool-common]
path = "crates/ene-tool-common"

[workspace.dependencies.ene-tool-db]
path = "crates/ene-tool-db"

[workspace.dependencies.ene-tool-derive]
path = "crates/ene-tool-derive"

[workspace.dependencies.ene-tool-host]
path = "crates/ene-tool-host"

[workspace.dependencies.ene-tool-proto]
path = "crates/ene-tool-proto"

[workspace.dependencies.ene-tool-rag]
path = "crates/ene-tool-rag"

[workspace.dependencies.ene-vrm]
path = "crates/ene-vrm"

[workspace.dependencies.async-openai]
version = "0.41"
default-features = false
features = [ "chat-completion", "embedding", "byot" ]

[workspace.dependencies.hf-hub]
version = "1.0.0-rc.1"
default-features = false

[workspace.dependencies.libsqlite3-sys]
version = "0.37"
features = [ "bundled" ]

[workspace.dependencies.sea-orm]
version = "2.0.0-rc.43"
features = [
"sqlx-sqlite",
"runtime-tokio-rustls",
"macros",
"with-chrono"
]

[workspace.dependencies.sea-orm-migration]
version = "2.0.0-rc.43"
features = [ "runtime-tokio-rustls", "sqlx-sqlite" ]

[workspace.dependencies.bevy_app]
version = "0.19"
default-features = false

[workspace.dependencies.bevy_ecs]
version = "0.19"
default-features = false

[workspace.dependencies.bytemuck]
version = "1"
features = [ "derive" ]

[workspace.dependencies.glam]
version = "0.33"
features = [ "bytemuck" ]

[workspace.dependencies.gltf]
version = "1.4"
default-features = false

[workspace.dependencies.rapier3d]
version = "0.34"
features = [ "simd-stable" ]

[workspace.dependencies.arboard]
version = "3.6"
features = [ "wayland-data-control" ]

[workspace.dependencies.ashpd]
version = "0.13"
default-features = false

[workspace.dependencies.tray-icon]
version = "0.24"
default-features = false

[workspace.dependencies.wayland-client]
version = "0.31"
default-features = false

[workspace.dependencies.wayland-protocols]
version = "0.32"
default-features = false
features = [ "staging", "client" ]

[workspace.dependencies.wayland-protocols-wlr]
version = "0.3"
default-features = false
features = [ "client" ]

[workspace.dependencies.windows-sys]
version = "0.61"
features = [
"Win32_Foundation",
"Win32_UI_WindowsAndMessaging",
"Win32_Graphics_Gdi"
]

[workspace.dependencies.x11rb]
version = "0.13"
default-features = false

[workspace.dependencies.base64]
version = "0.22"
default-features = false

[workspace.dependencies.cargo-husky]
version = "1.5"
default-features = false
features = [ "user-hooks", "run-for-all" ]

[workspace.dependencies.chrono]
version = "0.4"
features = [ "serde" ]

[workspace.dependencies.figment]
version = "0.10"
features = [ "json", "env" ]

[workspace.dependencies.i18n-embed]
version = "0.16"
features = [ "fluent-system", "fluent", "desktop-requester" ]

[workspace.dependencies.image]
version = "0.25"
default-features = false

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false

[workspace.dependencies.rmcp]
version = "2"
features = [
"client",
"transport-child-process",
"transport-streamable-http-client"
]

[workspace.dependencies.schemars]
version = "1.2"
features = [ "preserve_order" ]

[workspace.dependencies.serde]
version = "1"
features = [ "derive" ]

[workspace.dependencies.syn]
version = "2"
features = [ "full", "extra-traits" ]

[workspace.dependencies.tokio]
version = "1"
default-features = false
features = [ "rt", "rt-multi-thread", "macros", "sync", "time" ]

[workspace.dependencies.uuid]
version = "1"
features = [ "v4" ]

[workspace.dependencies.zip]
version = "8"
default-features = false

[workspace.metadata.cargo-husky]
run-for-all = true

[workspace.lints.clippy]
all         = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }

implicit_return = "allow"
single_call_fn = "allow"
missing_inline_in_public_items = "allow"
mod_module_files = "allow"
self_named_module_files = "allow"
pub_use = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
alloc_instead_of_core = "allow"
separated_literal_suffix = "allow"
unseparated_literal_suffix = "allow"
question_mark_used = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
missing_trait_methods = "allow"
blanket_clippy_restriction_lints = "allow"
arbitrary_source_item_ordering = "allow"
str_to_string = "allow"
doc_paragraphs_missing_punctuation = "allow"
iter_over_hash_type = "allow"
wildcard_enum_match_arm = "allow"
missing_assert_message = "allow"
inline_trait_bounds = "allow"
impl_trait_in_params = "allow"
unused_trait_names = "allow"
cargo_common_metadata = "allow"

cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
as_conversions = "allow"

missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_docs_in_private_items = "allow"

too_many_lines = "allow"
items_after_statements = "allow"
too_long_first_doc_paragraph = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
large_futures = "allow"
min_ident_chars = "allow"
single_char_lifetime_names = "allow"
exhaustive_structs = "allow"
exhaustive_enums = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"

float_arithmetic = "allow"
integer_division = "allow"
integer_division_remainder_used = "allow"
modulo_arithmetic = "allow"
default_numeric_fallback = "allow"
pattern_type_mismatch = "allow"
print_stdout = "allow"
print_stderr = "allow"
non_ascii_literal = "allow"
else_if_without_else = "allow"
map_err_ignore = "allow"
clone_on_ref_ptr = "allow"
string_add = "allow"
absolute_paths = "allow"
partial_pub_fields = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
missing_asserts_for_indexing = "allow"
exit = "allow"
pub_with_shorthand = "allow"
same_name_method = "allow"
little_endian_bytes = "allow"
big_endian_bytes = "allow"
needless_raw_strings = "allow"
semicolon_outside_block = "allow"
if_then_some_else_none = "allow"
field_scoped_visibility_modifiers = "allow"
ref_patterns = "allow"
cognitive_complexity = "allow"
inline_modules = "allow"
unneeded_field_pattern = "allow"
return_and_then = "allow"
redundant_type_annotations = "allow"
multiple_inherent_impl = "allow"
empty_structs_with_brackets = "allow"
filetype_is_file = "allow"
redundant_test_prefix = "allow"
assertions_on_result_states = "allow"
use_debug = "allow"
tests_outside_test_module = "allow"
mem_forget = "allow"
decimal_literal_representation = "allow"
renamed_function_params = "allow"

allow_attributes_without_reason = "deny"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ene-ai]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
