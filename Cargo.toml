[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
keyring = { version = "4", default-features = false, features = ["v1"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-software", "unstable-winit-030", "accessibility"] }
slint-build = "1.18"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = "0.26"
rustls = "0.23"
futures-util = "0.3"
rcgen = "0.14"
x509-parser = "0.16"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
wgpu = "30"
libc = "0.2"
glam = "0.29"
vrm-runtime = "0.1.0"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
csv = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.clippy]
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ene-body]
opt-level = 2

[profile.dev.package.vrm-runtime]
opt-level = 2
