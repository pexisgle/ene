[workspace]
members = [ "crates/*", "apps/*", "plugins/provider/*", "plugins/tool/*" ]
default-members = [ "apps/ene-cli" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pexisgle/ene"
publish = false

[workspace.dependencies]
# ── Async / Runtime ──
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# ── AI / LLM ──
llama-cpp-4 = { version = "0.4.2", default-features = false }
encoding_rs = "0.8"
# Local voice pipeline (STT/TTS/VAD); opt-in via ene-ai feature flags.
whisper-rs = "0.16"
ort = { version = "2.0.0-rc.12", default-features = false }

# ── GUI / Rendering / 3D ──
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = false }
image = { version = "0.25", default-features = false }
wgpu = "29"

# ── Audio / DSP ──
cpal = "0.18"
rodio = { version = "0.22", default-features = false }
rustfft = "6"

# ── Database ──
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
sqlite-vec = "0.1"

# ── Serialization / Config ──
base64 = { version = "0.23", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["json", "env"] }
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# ── Logging ──
tracing = "0.1"
tracing-subscriber = "0.3"

# ── Terminal / CLI ──
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"

# ── Networking ──
http = "1"
reqwest = { version = "0.13", default-features = false }
scraper = "0.27"
quick-xml = { version = "0.41", features = ["serialize"] }
url = "2"

# ── IPC / Tool System ──
proc-macro2 = "1"
quote = "1"
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
syn = { version = "3", features = ["full", "extra-traits"] }

# ── Data Structures ──
crossbeam-channel = "0.5"
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

# ── Text Processing ──
ego-tree = "0.11"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
htmd = "0.5"
sys-locale = "0.3"
unicode-normalization = "0.1"

# ── Utility ──
blake3 = "1.8"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }
directories = "6"
hex = "0.4"
sha2 = "0.11"
rand = "0.10"
rayon = "1.12"
regex = "1"
tempfile = "3"

# ── Dev Tooling ──
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks", "run-for-all"] }
ctor = "1.0"
thiserror = "2.0"
zip = { version = "8", default-features = false }

# ── Internal crates ──
ene-connector = { path = "crates/ene-connector" }
ene-ai = { path = "crates/ene-ai" }
ene-ai-local = { path = "crates/ene-ai-local" }
ene-config = { path = "crates/ene-config" }
ene-core = { path = "crates/ene-core" }
ene-infer = { path = "crates/ene-infer" }
ene-mind = { path = "crates/ene-mind" }
ene-plugin = { path = "crates/ene-plugin" }
ene-plugin-db = { path = "crates/ene-plugin-db" }
ene-plugin-host = { path = "crates/ene-plugin-host" }
ene-plugin-macros = { path = "crates/ene-plugin-macros" }
ene-plugin-proto = { path = "crates/ene-plugin-proto" }
ene-rag = { path = "crates/ene-rag" }
ene-runtime = { path = "crates/ene-runtime" }
ene-store = { path = "crates/ene-store" }
ene-util = { path = "crates/ene-util" }
ene-voice = { path = "crates/ene-voice" }
ene-vrm = { path = "crates/ene-vrm" }

[workspace.metadata.cargo-husky]
run-for-all = true

[workspace.lints.clippy]
# `restriction` is an opt-in menu, not a group to deny wholesale; its lints are
# adopted one by one below.
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# ── `pedantic` / `cargo` opt-outs ──
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
large_futures = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

# ── `restriction` lints adopted individually ──
# Exceptions are `#[expect(lint, reason = "...")]`, scoped as narrowly as
# possible — never a workspace-wide allow.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ash]
opt-level = 2

[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.egui-wgpu]
opt-level = 2

[profile.dev.package.egui-winit]
opt-level = 2

[profile.dev.package.glam]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.rapier3d]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# `panic = "abort"` is deliberately omitted: ene-runtime's actor relies on
# catch_unwind isolation (crates/ene-runtime/src/handle/actor.rs, and
# docs/architecture.md "Fault tolerance"). Do not add it.
strip = true
overflow-checks = true
