[package]
name = "ene-plugin-openai"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible provider plugin: chat, streaming, and embeddings over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
