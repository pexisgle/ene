[package]
name = "ene-plugin-anthropic"
version.workspace = true
edition.workspace = true
description = "Anthropic Claude plugin: Messages API streaming and completion over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The HTTP client (reqwest) comes from ene-plugin's `http` feature so the
# plugin never resolves or manages credentials itself.
ene-plugin = { workspace = true, features = ["http"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
