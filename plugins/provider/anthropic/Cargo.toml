[package]
name = "ene-plugin-anthropic"
version.workspace = true
edition.workspace = true
description = "Anthropic Claude plugin: Messages API streaming and completion over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
ene-plugin-proto = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
