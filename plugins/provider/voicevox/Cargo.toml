[package]
name = "ene-plugin-voicevox"
version.workspace = true
edition.workspace = true
description = "VOICEVOX / Aivis Speech-compatible TTS provider plugin over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
