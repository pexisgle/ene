[package]
name = "ene-plugin-llama-cpp"
version.workspace = true
edition.workspace = true
description = "Local GGUF (llama.cpp) provider plugin: chat streaming, completion, and embeddings over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["local"]
# CPU-only llama.cpp (the CI-tested default). `vulkan` / `cuda` opt into GPU
# backends; they are compile-only in CI (no GPU hardware).
local = ["dep:llama-cpp-4", "llama-cpp-4/mtmd", "llama-cpp-4/openmp"]
vulkan = ["dep:llama-cpp-4", "llama-cpp-4/vulkan"]
cuda = ["dep:llama-cpp-4", "llama-cpp-4/cuda"]

[dependencies]
ene-ai = { workspace = true }
ene-config = { workspace = true }
ene-infer = { workspace = true }
ene-plugin = { workspace = true }
ene-plugin-proto = { workspace = true }
llama-cpp-4 = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
once_cell = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
blake3 = { workspace = true }
ene-infer = { workspace = true, features = ["test-util"] }
ene-plugin-proto = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
