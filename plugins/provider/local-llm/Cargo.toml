[package]
name = "ene-plugin-llama-cpp"
version.workspace = true
edition.workspace = true
description = "Local GGUF (llama.cpp) provider plugin: chat streaming, completion, and embeddings over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
vulkan = ["ene-ai-local/vulkan"]
cuda = ["ene-ai-local/cuda"]

[dependencies]
ene-ai = { workspace = true }
ene-ai-local = { workspace = true }
ene-plugin = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
blake3 = { workspace = true }
ene-plugin-proto = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
