[package]
name = "ene-plugin-onnx"
version.workspace = true
edition.workspace = true
description = "Local ONNX provider plugin: Silero VAD engine plus onnx-runner / g2p capability declarations"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
ene-voice = { workspace = true, features = ["silero-vad"] }
ene-ai = { workspace = true }
ene-config = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
