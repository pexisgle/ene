[package]
name = "ene-plugin-elevenlabs"
version.workspace = true
edition.workspace = true
description = "ElevenLabs TTS provider plugin (REST + WebSocket streaming) over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, features = ["std"] }
chrono = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-segmentation = { workspace = true }

[lints]
workspace = true
