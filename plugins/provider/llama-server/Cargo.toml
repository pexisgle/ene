[package]
name = "ene-plugin-llama-server"
version.workspace = true
edition.workspace = true
description = "llama-server sidecar provider plugin: chat streaming, completion, and embeddings over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-ai = { workspace = true }
ene-config = { workspace = true }
ene-plugin = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
ene-plugin-proto = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
