[package]
name = "ene-plugin-whisper"
version.workspace = true
edition.workspace = true
description = "Local whisper.cpp STT provider plugin over the unified plugin IPC"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hound = { workspace = true }
ene-plugin = { workspace = true }
ene-voice = { workspace = true, features = ["local-stt"] }
ene-ai = { workspace = true }
ene-config = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "rustls-no-provider"] }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
