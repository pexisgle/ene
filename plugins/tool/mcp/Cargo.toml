[package]
name = "ene-tool-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio / Streamable HTTP bridge plugin"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-tool-mcp"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
ene-plugin-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "macros", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
ene-plugin-host = { workspace = true }
ene-tool-registry = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
