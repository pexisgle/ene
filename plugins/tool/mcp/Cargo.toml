[package]
name = "ene-tool-mcp"
version.workspace = true
edition.workspace = true
description = "MCP stdio bridge plugin (handwritten profile rows, P-603)"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-tool-mcp"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
ene-plugin-ipc = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
ene-fiber = { workspace = true }
ene-registry = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
