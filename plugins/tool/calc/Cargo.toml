[package]
name = "ene-plugin-calc"
version.workspace = true
edition.workspace = true
description = "Calculation tools: math expression evaluation, unit conversion, currency conversion, and color conversion"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-plugin-calc"
path = "src/main.rs"

[dependencies]
ene-plugin = { workspace = true }
ene-plugin-proto = { workspace = true }
meval = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["rustls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { workspace = true, features = ["native-tls", "json"] }

[lints]
workspace = true
