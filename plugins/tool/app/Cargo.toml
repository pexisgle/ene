[package]
name = "ene-tool-app"
version.workspace = true
edition.workspace = true
description = "App tool plugin: screenshot, windows, clipboard, input"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-tool-app"
path = "src/main.rs"

[dependencies]
arboard = { workspace = true }
base64 = { workspace = true, features = ["std"] }
ene-plugin-ipc = { workspace = true }
ene-registry = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true }

[target.'cfg(windows)'.dependencies]
image = { workspace = true, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ene-fiber = { workspace = true }
ene-registry = { workspace = true }
ene-plane = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
