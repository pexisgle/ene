[package]
name = "ene-plugin-homeassistant"
version.workspace = true
edition.workspace = true
description = "Home Assistant smart home tools: entity state, switch/light/plug control, climate temperature"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ene-plugin-homeassistant"
path = "src/main.rs"

[dependencies]
ene-plugin = { workspace = true }
ene-plugin-proto = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { workspace = true, features = ["native-tls", "json", "stream"] }

[lints]
workspace = true
