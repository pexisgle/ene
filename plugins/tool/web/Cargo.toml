[package]
name = "ene-plugin-web"
version.workspace = true
edition.workspace = true
description = "Web tools: URL fetching with HTML-to-Markdown conversion and multi-backend web search"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
ene-plugin-broker = { workspace = true }
ene-plugin-proto = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
ene-util = { workspace = true, features = ["html"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
scraper = { workspace = true }
quick-xml = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[[bin]]
name = "ene-plugin-web"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
