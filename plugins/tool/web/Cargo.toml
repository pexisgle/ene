[package]
name = "ene-plugin-web"
version.workspace = true
edition.workspace = true
description = "Web tools: URL fetching with HTML-to-Markdown conversion and multi-backend web search"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ene-plugin = { workspace = true }
ene-plugin-proto = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
ene-tool-sdk = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
scraper = { workspace = true }
quick-xml = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["rustls", "json", "query", "form"] }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { workspace = true, features = ["native-tls", "json", "query", "form"] }

[[bin]]
name = "ene-plugin-web"
path = "src/main.rs"

[lints]
workspace = true
